# KubeDash local developer environment.
#
# Brings up the five backends the Flask backend and the query-only
# observability layer (ARCHITECTURE.md §6) need for local work:
#   - postgres / redis  -> the app's data stores (ports pinned to the app's
#     defaults so KUBEDASH_DATABASE_URL / KUBEDASH_REDIS_URL need no change)
#   - prometheus        -> metrics backend
#   - grafana           -> dashboards (auto-provisions datasources)
#   - jaeger            -> traces backend (OTLP collector enabled)
#
# Start/stop/clean via the root Taskfile:  task dev-up / dev-down / dev-clean
name: kubedash-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${KUBEDASH_DB_USER:-kubedash}
      POSTGRES_PASSWORD: ${KUBEDASH_DB_PASSWORD:-kubedash}
      POSTGRES_DB: ${KUBEDASH_DB_NAME:-kubedash}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KUBEDASH_DB_USER:-kubedash} -d ${KUBEDASH_DB_NAME:-kubedash}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 15s

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Pushgateway: durable landing zone for ephemeral test runs. pytest / e2e push
  # a result gauge here; Prometheus scrapes it and the last push is retained, so
  # Grafana always shows "what did the last test run produce" even after the run
  # is gone. (Prometheus itself is query-only per ARCHITECTURE.md §6 — it never
  # receives test metrics directly.)
  pushgateway:
    image: prom/pushgateway:latest
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: info
    volumes:
      - grafdata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  promdata:
  grafdata:
