# KubeDash local developer environment.
#
# Brings up the five backends the Flask backend and the query-only
# observability layer (ARCHITECTURE.md §6) need for local work:
#   - pgEdge (two-node active-active) / no redis -> the app's data store
#     (ports pinned to the app's defaults so KUBEDASH_DATABASE_URL needs no
#     change; ADR-0029/0030/0031)
#   - prometheus        -> metrics backend
#   - grafana           -> dashboards (auto-provisions datasources)
#   - jaeger            -> traces backend (OTLP collector enabled)
#
# Start/stop/clean via the root Taskfile:  task dev-up / dev-down / dev-clean
name: kubedash-dev

services:
  # ADR-0029/0030/0031: the dev default is a two-node pgEdge active-active
  # cluster (spock + autoddl), not postgres:16 + redis. The cluster definition
  # lives in ./pgedge/db.json: it creates the `kubedash` superuser (service
  # `kubedash` — the app connects as kubedash:kubedash@localhost:5432/kubedash,
  # the creds are unchanged) and the `pgedge` internal_admin user that
  # autoddl requires. n1 serves the dev port; n2 on a fixed alt port.
  kdpg-n1:
    image: pgedge/pgedge:pg17-latest
    container_name: kdpg-n1
    environment:
      - NODE_NAME=n1
      - PGDATA=/data/pgdata
    volumes:
      - ./pgedge/db.json:/home/pgedge/db.json
      - kdpg-n1-data:/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubedash -d kubedash"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 15s

  kdpg-n2:
    image: pgedge/pgedge:pg17-latest
    container_name: kdpg-n2
    environment:
      - NODE_NAME=n2
      - PGDATA=/data/pgdata
    volumes:
      - ./pgedge/db.json:/home/pgedge/db.json
      - kdpg-n2-data:/data
    ports:
      - "16433:5432"
    depends_on:
      - kdpg-n1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubedash -d kubedash"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 15s

  prometheus:
    image: prom/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Pushgateway: durable landing zone for ephemeral test runs. pytest / e2e push
  # a result gauge here; Prometheus scrapes it and the last push is retained, so
  # Grafana always shows "what did the last test run produce" even after the run
  # is gone. (Prometheus itself is query-only per ARCHITECTURE.md §6 — it never
  # receives test metrics directly.)
  pushgateway:
    image: prom/pushgateway:latest
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: info
    volumes:
      - grafdata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    # WHY: the image ships conf.d/default.conf (welcome page) which would
    # 404/200 on :80 before our server block's 301 can run for Host mismatches;
    # delete it so kubedash.conf is the only :80/:443 listener (ADR-0026).
    # `nginx -g "daemon off;"` (not the entrypoint's `nginx`): the entrypoint
    # runs nginx daemonized, which exits the container; the -g form keeps the
    # master in the foreground (verified 2026-10-24).
    entrypoint: ["/bin/sh", "-c"]
    command: ["rm -f /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/kubedash.conf:/etc/nginx/conf.d/kubedash.conf:ro
      - ./certs:/etc/nginx/certs:ro
    # 4.1's conf: the upstream is "host-gateway", which nginx cannot resolve
    # at startup unless the container's /etc/hosts maps it — the backend
    # listens on the host, not on the compose network.
    extra_hosts:
      - "host-gateway:host-gateway"
    # WHY curl (not wget): nginx:1.27 (debian) ships /usr/bin/curl 7.88 but
    # NO wget — the original wget probe exited 127, so the container could
    # never reach "healthy". --resolve maps kubedash.dev.local to 127.0.0.1 so
    # the mkcert SAN matches (no -k/--insecure needed) and --cacert verifies
    # the CHAIN against the mkcert rootCA — the half that matters for a health
    # check. A 502 (backend down) is NOT a health failure: the edge itself is
    # healthy, so accept 2xx/3xx/502 and fail on anything else.
    healthcheck:
      # WHY the case word is an inline substitution: compose parses $-
      # sequences as variable refs BEFORE the shell runs, and it only
      # substitutes $WORD forms — a bare $-sequence in the case word
      # ($code, $hc_code, \$(...)) was silently blanked, leaving `case in`
      # (dash: "word unexpected"). $(curl ...) contains no $, so the
      # substitution itself survives to the shell.
      test: ["CMD-SHELL", "case $(curl -s -o /dev/null -w '%{http_code}' --cacert /etc/nginx/certs/rootCA.pem --resolve kubedash.dev.local:443:127.0.0.1 https://kubedash.dev.local:443/healthz) in 2*|3*|502) exit 0;; *) exit 1;; esac"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sso:
    build:
      context: ./sso
    ports:
      - "${SSO_PORT:-8888}:8888"
    environment:
      SSO_ISSUER: "http://localhost:${SSO_PORT:-8888}"
      SSO_CLIENT_ID: "kubedash-dev"
      SSO_SECRET: "dev-sso-secret-32-bytes!!!!!01"
      # Pre-created SSO users: email:name:role (comma-separated).
      # These are NOT the local bootstrap admin (KUBEDASH_BOOTSTRAP_ADMIN_*).
      # Extra (non-role) groups are hardcoded in server.py (_user_extra_groups).
      SSO_USERS: "dev@local:Dev User:user,admin-ss@local:SSO Admin:admin"
    restart: unless-stopped

volumes:
  kdpg-n1-data:
  kdpg-n2-data:
  promdata:
  grafdata:
