# Auto-provisioned datasources so a fresh `docker compose up` gives a working
# dashboard with no manual clicks. No Loki (per scope — metrics + traces only).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    isDefault: false
