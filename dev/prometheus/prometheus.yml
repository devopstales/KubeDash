# KubeDash dev Prometheus.
#
# Query-only (ARCHITECTURE.md §6): the app reads metrics from Prometheus, it
# does not scrape itself. This dev instance self-scrapes so there is at least
# one live series to query, and Grafana has something to plot.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - "localhost:9090"

  # Test-result metrics: pytest (test-unit) and Playwright e2e (test-smoke /
  # test-e2e) push a result gauge to the Pushgateway; Prometheus scrapes it.
  # The last push per job (kubedash-unit / kubedash-smoke / kubedash-e2e) is
  # retained, giving Grafana a durable last-run feed.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets:
          - "pushgateway:9091"

  # Add the real backends here as the dev stack grows, e.g.:
  # - job_name: cadvisor
  #   static_configs:
  #     - targets: ["cadvisor:8080"]
  # - job_name: kube-state-metrics
  #   static_configs:
  #     - targets: ["kube-state-metrics:8080"]
