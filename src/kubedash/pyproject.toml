flask-session = "0.8.0"
flask-wtf = "1.2.1"
flask-socketio = "5.5.1"
pyyaml = "^6.0.2"
jinja2 = "3.1.6"
dnspython = "2.6.1"
pytz = "2023.3.post1"
configparser = "7.0.0"
sqlalchemy = "2.0.17"
sqlalchemy-utils = "0.41.1"
flask-migrate = "4.0.5"
requests-oauthlib = "2.0.0"
flask-cors = "6.0.0"
flask-talisman = "1.1.0"
kubernetes = "26.1.0"
pybase64 = "1.4.0"
pyvis = "0.3.2"
gevent-websocket = "0.10.1"
prometheus-flask-exporter = "0.23.1"
certifi = "2024.07.04"
setuptools = ">=78.1.1"
wheel = ">=0.46.2"
pyopenssl = "25.1.0"
cryptography = "44.0.1"
ipython = "8.27.0"
gevent = "23.9.0"
urllib3 = "2.6.3"
requests = "2.32.4"
zipp = "3.19.1"
apiflask = {extras = ["yaml"], version = "^2.3.2"}
watchdog = "^6.0.0"
gunicorn-color = "^0.1.0"
psycopg2-binary = "^2.9.10"
flask-smorest = "^0.46.1"
h11 = "0.16.0"
swagger-ui-bundle = "^1.1.0"
flask-caching = "^2.3.1"
plotly = "^6.0.0"
redis = "^5.2.1"
colorlog = "^6.9.0"
protobuf = "6.33.5"
statsd = "^4.0.1"
prometheus-client = "^0.22.1"
gunicorn = {extras = ["statsd"], version = "^23.0.0"}
opentelemetry-instrumentation-sqlalchemy = "^0.56b0"
opentelemetry-instrumentation-requests = "^0.56b0"
opentelemetry-api = "^1.34.1"
opentelemetry-sdk = "^1.34.1"
opentelemetry-instrumentation-flask = "^0.56b0"
opentelemetry-instrumentation-wsgi = "^0.56b0"
opentelemetry-instrumentation-logging = "^0.56b0"
opentelemetry-exporter-otlp-proto-http = "^1.34.1"
opentelemetry-instrumentation-redis = "^0.56b0"
flask-prometheus-metrics = "^1.0.0"
wrapt = "^1.17.2"
bs4 = "^0.0.2"
validators = "^0.35.0"
# Security fixes for transitive dependencies
authlib = "^1.6.6"  # Fixed CVE-2025-68158
python-socketio = "^5.14.0"
fonttools = "^4.60.2"
brotli = "^1.2.0"
marshmallow = "^4.1.2"
pyasn1 = "^0.6.2"
tinycss2 = "^1.5.0"
safety = "^3.7.0"
detect-secrets = "^1.5.0"
# CLI dependencies
click = "^8.1.0"


[tool.poetry.group.dev.dependencies]
black = "^24.3.0"
isort = "^5.10.1"
pip-audit = "^2.4.4"
autoflake = "^1.6.1"
safety = "^3.3.1"
flake8 = "^7.1.2"
pip = ">=26.0"
semgrep = "^1.45.0"
GitPython = "^3.1.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.2.1"
pytest-order = "^1.0.1"
pytest-flask = "^1.2.0"
pytest-cov = "^4.0.0"
pytest-playwright = "^0.3.1"
coverage = "^6.4.4"
responses = "^0.22.0"
selenium = "^4.15.1"
semgrep = "^1.45.0"
safety = "^3.7.0"
pip-audit = "^2.4.4"

#[tool.poetry.requires-plugins]
#poetry-plugin-export = ">=1.8"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
kubedash = "lib.cli:main"

[tool.black]
line-length = 120
include = '\.pyi?$'
known_first_party = ["app", "tests"]
exclude='(\.eggs|\.git|\.idea|\.pytest_cache|venv|build|dist|logs)'

[tool.pytest.ini_options]
log_cli = true
filterwarnings = [
    "ignore::urllib3.exceptions.InsecureRequestWarning",
    "ignore::DeprecationWarning",
    "ignore::sqlalchemy.exc.SAWarning",
]
pythonpath = "."
live_server_scope = "function"

[tool.coverage.run]
branch = true
source = ["blueprint", "lib", "plugins"]
omit = ["tests/*", "migrations/*", "__pycache__/*"]
command_line = "-m pytest tests --junitxml reports/test.xml --durations 0 --verbose"

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.html]
directory = "reports/coverage_html"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 70

# Semgrep: exclusions (B101/B601 equivalents) via CLI --exclude-rule; paths via .semgrepignore

[tool.autoflake]
recursive = true
remove-all-unused-imports = true
remove-unused-variables = true
ignore-init-module-imports = true
exclude = ".git,.idea,.pytest_cache,__pycache__,logs,static,test/reports,venv,.venv"
