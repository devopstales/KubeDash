version: '3'

env:
  VERSION: "4.1.0"
  DATE: 
    sh: date "+%Y.%m.%d"
  DCFILES: "-f dc-nginx.yaml -f dc-postgresql.yaml -f dc-redis.yaml -f dc-registry.yaml -f dc-exporter.yaml -f dc-jaeger.yaml -f dc-kubeview.yaml"

tasks:
  default:
    desc: "Print Help"
    cmds:
      - "task --list-all"

  install-deps:
    desc: "Install development dependencies"
    cmds:
      - curl -sSL https://install.python-poetry.org | python3 -
      - poetry self add poetry-plugin-export || echo "⚠️  poetry-plugin-export may already be installed"
      - brew install helm
      - brew install helm-docs
      - brew install chart-releaser
      - brew install trivy
      - brew install cosign
      - brew install skopeo
      - brew install oras
      - brew install fluxcd/tap/flux

  docker-up:
    desc: "Start dev containers"
    dir: 'deploy/docker-compose'
    cmds:
      - docker compose {{.DCFILES}} up -d

  docker-images:
    desc: "Copy docker images"
    dir: '/tmp'
    cmds:
      # - skopeo login --tls-verify=false 127.0.0.1:4000
      # - skopeo login docker.io
      - skopeo copy --dest-tls-verify=false --override-os=linux docker://docker.io/library/python:3.12-rc-alpine docker://127.0.0.1:4000/python:3.12-rc-alpine
      - skopeo copy --dest-tls-verify=false --override-os=linux docker://docker.io/devopstales/registry-imega-test:1.0 docker://127.0.0.1:4000/registry-imega-test:1.0
      - skopeo copy --dest-tls-verify=false --override-os=linux docker://docker.io/devopstales/registry-imega-test:2.0 docker://127.0.0.1:4000/registry-imega-test:2.0
      - skopeo copy --dest-tls-verify=false --override-os=linux docker://docker.io/devopstales/registry-imega-test:3.0 docker://127.0.0.1:4000/registry-imega-test:3.0
      - docker pull devopstales/registry-imega-test:3.0
      - docker tag devopstales/registry-imega-test:3.0 127.0.0.1:4000/registry-imega-test:test
      - docker push 127.0.0.1:4000/registry-imega-test:test
      - cosign sign --key $HOME/.gnupg/cosign.key 127.0.0.1:4000/registry-imega-test:test -y 2>/dev/null
      # - oras login --plain-http 127.0.0.1:4000
      - oras copy --to-plain-http ghcr.io/aquasecurity/trivy-db:2 127.0.0.1:4000/trivy-db:2
      - oras copy --to-plain-http ghcr.io/aquasecurity/trivy-java-db:1 127.0.0.1:4000/trivy-java-db:1
      - helm pull oci://registry-1.docker.io/bitnamicharts/redis --version 17.9.5
      - helm push redis-17.9.5.tgz OCI://127.0.0.1:4000/helm-charts
      - rm -f redis-17.9.5.tgz
      - trivy i --format cosign-vuln 127.0.0.1:4000/registry-imega-test:1.0 > image.sbom
      - cosign attach sbom --sbom image.sbom 127.0.0.1:4000/registry-imega-test:1.0
      - rm -f image.sbom
      - git clone https://github.com/stefanprodan/podinfo.git /tmp/podinfo
      - |
        flux push artifact oci://127.0.0.1:4000/podinfo:$(git -C /tmp/podinfo rev-parse --short HEAD) \
        	--path="/tmp/podinfo/kustomize" \
        	--source="$(git -C /tmp/podinfo config --get remote.origin.url)" \
        	--revision="$(git -C /tmp/podinfo branch --show-current)@sha1:$(git rev-parse HEAD)"

  docker-down:
    desc: "Stop dev containers"
    dir: 'deploy/docker-compose'
    cmds:
      - docker compose {{.DCFILES}} down

  kubedash-requirements:
    desc: "Generate Kubedash requirements"
    dir: 'src/kubedash'
    cmds:
      - |
        poetry show --only main --top-level | awk 'NR>2 {if (NF >= 2) print $1"=="$2}' > requirements.txt || \
        poetry show --only main | tail -n +3 | awk '{if (NF >= 2) print $1"=="$2}' > requirements.txt

  kubedash-safety:
    desc: "Safety check Kubedash requirements (DEPRECATED - use kubedash-audit instead)"
    dir: 'src/kubedash'
    cmds:
      - |
        echo "⚠️  WARNING: safety check command is DEPRECATED (unsupported after June 1, 2024)"
        echo "💡 Recommendation: Use 'task kubedash-audit' instead (uses pip-audit)"
        echo ""
        echo "Skipping deprecated safety check..."
        echo "✅ Use 'task kubedash-audit' for dependency vulnerability scanning"
        exit 0

  kubedash-audit:
    desc: "Run pip-audit for dependency vulnerabilities"
    dir: 'src/kubedash'
    cmds:
      - poetry run pip-audit || echo "⚠️  Vulnerabilities found - run 'task kubedash-fix-vulns' to update"

  kubedash-audit-strict:
    desc: "Run pip-audit and fail on vulnerabilities (for CI)"
    dir: 'src/kubedash'
    cmds:
      - poetry run pip-audit

  kubedash-scan:
    desc: "Scan Kubedash filesystem for vulnerabilities"
    dir: 'src/kubedash'
    cmds:
      - trivy -q fs . --ignore-unfixed --scanners vuln

  kubedash-security-check:
    desc: "Run comprehensive security checks (hardcoded secrets, weak crypto, etc.) - logs warnings only"
    dir: 'src/kubedash'
    cmds:
      - |
        echo "Checking for hardcoded secrets and credentials..."
        SECRET_KEY_ISSUES=$(grep -r "SECRET_KEY.*=.*['\"].*['\"]" . --include="*.py" \
          --exclude-dir=".venv" --exclude-dir="__pycache__" --exclude-dir=".git" \
          | grep -v "os.urandom\|secrets\|generate" | grep -v "develop" | grep -v "# nosec" | grep -v "nosec" || true)
        if [ -n "$SECRET_KEY_ISSUES" ]; then
          echo "⚠️  WARNING: Potential hardcoded SECRET_KEY found:"
          echo "$SECRET_KEY_ISSUES" | while read line; do
            echo "   $line"
          done
        else
          echo "   ✅ No hardcoded SECRET_KEY found"
        fi
      - |
        echo "Checking for default admin password..."
        ADMIN_PWD_ISSUES=$(grep -r "admin_password.*fallback.*admin" . --include="*.py" \
          --exclude-dir=".venv" --exclude-dir="__pycache__" --exclude-dir=".git" || true)
        if [ -n "$ADMIN_PWD_ISSUES" ]; then
          echo "⚠️  WARNING: Default admin password detected:"
          echo "$ADMIN_PWD_ISSUES" | while read line; do
            echo "   $line"
          done
        else
          echo "   ✅ No default admin password found"
        fi
      - |
        echo "Checking for database passwords in connection strings..."
        DB_PWD_ISSUES=$(grep -r "postgresql://.*:.*@" . --include="*.py" \
          --exclude-dir=".venv" --exclude-dir="__pycache__" --exclude-dir=".git" \
          | grep -v "#.*password" || true)
        if [ -n "$DB_PWD_ISSUES" ]; then
          echo "⚠️  WARNING: Database password may be exposed in connection string:"
          echo "$DB_PWD_ISSUES" | while read line; do
            echo "   $line"
          done
        else
          echo "   ✅ No exposed database passwords found"
        fi
      - |
        echo "Checking for weak SECRET_KEY generation..."
        WEAK_KEY_ISSUES=$(grep -r "os.urandom(12)" . --include="*.py" \
          --exclude-dir=".venv" --exclude-dir="__pycache__" --exclude-dir=".git" || true)
        if [ -n "$WEAK_KEY_ISSUES" ]; then
          echo "⚠️  WARNING: SECRET_KEY generation uses only 12 bytes (should be 32+):"
          echo "$WEAK_KEY_ISSUES" | while read line; do
            echo "   $line"
          done
        else
          echo "   ✅ No weak SECRET_KEY generation found"
        fi
      - |
        echo "Checking for unsafe CSP directives..."
        CSP_ISSUES=$(grep -r "'unsafe-inline'\|'unsafe-eval'" . --include="*.py" \
          --exclude-dir=".venv" --exclude-dir="__pycache__" --exclude-dir=".git" \
          | grep -v "#.*CSP" || true)
        if [ -n "$CSP_ISSUES" ]; then
          echo "⚠️  WARNING: CSP contains unsafe-inline or unsafe-eval:"
          echo "$CSP_ISSUES" | while read line; do
            echo "   $line"
          done
        else
          echo "   ✅ No unsafe CSP directives found"
        fi
      - |
        echo "Checking for CSRF exemptions..."
        CSRF_ISSUES=$(grep -r "csrf.exempt" . --include="*.py" \
          --exclude-dir=".venv" --exclude-dir="__pycache__" --exclude-dir=".git" || true)
        if [ -n "$CSRF_ISSUES" ]; then
          echo "⚠️  WARNING: CSRF protection is disabled for some blueprints:"
          echo "$CSRF_ISSUES" | while read line; do
            echo "   $line"
          done
        else
          echo "   ✅ No CSRF exemptions found"
        fi
      - echo "✅ Security checks completed (warnings logged above)"

  kubedash-secret-scan:
    desc: "Scan for hardcoded secrets and credentials using detect-secrets (optional)"
    dir: 'src/kubedash'
    ignore_error: true
    cmds:
      - |
        # Try to use detect-secrets, but skip gracefully if it's not available
        # This is an optional tool, so we don't want it to break the build
        # Check if detect-secrets is available in poetry environment first
        if poetry run detect-secrets --version >/dev/null 2>&1; then
          echo "🔍 Running detect-secrets scan..."
          poetry run detect-secrets scan --baseline .secrets.baseline 2>/dev/null || true
          if [ -f .secrets.baseline ]; then
            poetry run detect-secrets audit .secrets.baseline 2>/dev/null || echo "   ⚠️  Audit completed with warnings"
          else
            echo "   ℹ️  No baseline file found (first run)"
          fi
        elif command -v detect-secrets >/dev/null 2>&1; then
          # Fallback to system-installed detect-secrets
          DETECT_SECRETS_CMD=$(command -v detect-secrets)
          if [ -f "$DETECT_SECRETS_CMD" ] && [ -x "$DETECT_SECRETS_CMD" ]; then
            if sh -c '"$0" --version >/dev/null 2>&1' "$DETECT_SECRETS_CMD" 2>/dev/null; then
              echo "🔍 Running detect-secrets scan..."
              sh -c '"$0" scan --baseline .secrets.baseline 2>/dev/null' "$DETECT_SECRETS_CMD" || true
              if [ -f .secrets.baseline ]; then
                sh -c '"$0" audit .secrets.baseline 2>/dev/null' "$DETECT_SECRETS_CMD" || echo "   ⚠️  Audit completed with warnings"
              else
                echo "   ℹ️  No baseline file found (first run)"
              fi
            else
              echo "⚠️  detect-secrets found but execution failed"
              echo "💡 Reinstall with: pip install --upgrade detect-secrets"
              echo "   Or: poetry add --group dev detect-secrets"
              echo "   Skipping secret scan (optional tool)"
            fi
          else
            echo "⚠️  detect-secrets found but not executable: $DETECT_SECRETS_CMD"
            echo "💡 Reinstall with: pip install --upgrade detect-secrets"
            echo "   Or: poetry add --group dev detect-secrets"
            echo "   Skipping secret scan (optional tool)"
          fi
        else
          echo "⚠️  detect-secrets not found"
          echo "💡 Install with: poetry add --group dev detect-secrets"
          echo "   Or: pip install detect-secrets"
          echo "   Skipping secret scan (optional tool)"
        fi

  kubedash-bandit:
    desc: "Run Bandit security linter for common Python security issues"
    dir: 'src/kubedash'
    cmds:
      - |
        if poetry run bandit --version >/dev/null 2>&1; then
          echo "🔍 Running Bandit security scan..."
          # Run bandit with quiet mode to suppress verbose warnings
          # Only show actual security issues, not test name warnings
          poetry run bandit -r . -f json -o bandit-report.json 2>/dev/null || true
          # Run with quiet flag to suppress manager/tester warnings
          poetry run bandit -r . -ll -q 2>&1 | grep -v "WARNING.*Test in comment" | grep -v "WARNING.*nosec encountered" | grep -v "Working..." || true
          if [ -f bandit-report.json ]; then
            echo "   📄 Report saved to bandit-report.json"
          fi
        else
          echo "⚠️  Bandit not installed. Add to pyproject.toml: bandit = {version = \"^1.7.5\", group = \"dev\"}"
        fi

  kubedash-semgrep:
    desc: "Run Semgrep security scanner for code vulnerabilities"
    dir: 'src/kubedash'
    cmds:
      - |
        if command -v semgrep >/dev/null 2>&1; then
          semgrep --config=auto --json -o semgrep-report.json . || true
          semgrep --config=auto .
        else
          echo "⚠️  Semgrep not installed. Install with: pip install semgrep"
          echo "   Or use: brew install semgrep"
        fi

  kubedash-fix-vulns:
    desc: "Automatically detect and update vulnerable dependencies to fixed versions"
    dir: 'src/kubedash'
    cmds:
      - |
        echo "🔍 Scanning for vulnerable dependencies..."
        poetry run pip-audit --format json > /tmp/pip-audit-output.json 2>/dev/null || poetry run pip-audit > /tmp/pip-audit-output.txt 2>&1 || true
      - |
        echo "📦 Extracting vulnerable packages..."
        python3 -c "
        import json
        import sys
        import re
        import os
        
        packages = set()
        
        # Try JSON format first
        json_file = '/tmp/pip-audit-output.json'
        txt_file = '/tmp/pip-audit-output.txt'
        
        if os.path.exists(json_file):
            try:
                with open(json_file, 'r') as f:
                    data = json.load(f)
                    vulns = data.get('vulnerabilities', [])
                    for vuln in vulns:
                        name = vuln.get('name', '').strip()
                        if name and name.lower() not in ['kubedash', 'name', 'skip']:
                            packages.add(name)
            except:
                pass
        
        # Fallback to text format
        if not packages and os.path.exists(txt_file):
            try:
                with open(txt_file, 'r') as f:
                    lines = f.readlines()
                in_table = False
                for line in lines:
                    line = line.strip()
                    if 'Name' in line and 'Version' in line:
                        in_table = True
                        continue
                    if in_table and line and not line.startswith('-') and '--------' not in line:
                        parts = line.split()
                        if len(parts) >= 2:
                            pkg_name = parts[0].strip()
                            if pkg_name and pkg_name.lower() not in ['name', 'skip', 'kubedash']:
                                if re.match(r'^[a-zA-Z0-9_-]+$', pkg_name):
                                    packages.add(pkg_name)
            except:
                pass
        
        print(' '.join(sorted(packages)))
        " > /tmp/vuln-packages.txt
      - |
        VULN_PACKAGES=$(cat /tmp/vuln-packages.txt 2>/dev/null || echo "")
        rm -f /tmp/pip-audit-output.json /tmp/pip-audit-output.txt /tmp/vuln-packages.txt
      - |
        # Check if pip-audit actually found vulnerabilities
        HAS_VULNS=$(poetry run pip-audit 2>&1 | grep -c "known vulnerabilities" || echo "0")
        NO_VULNS=$(poetry run pip-audit 2>&1 | grep -c "No known vulnerabilities" || echo "0")
        
        if [ -n "$VULN_PACKAGES" ] && [ "$VULN_PACKAGES" != " " ]; then
          echo "Found vulnerable packages: $VULN_PACKAGES"
          echo ""
          echo "🔄 Updating packages..."
          UPDATED=0
          FAILED=0
          
          for pkg in $VULN_PACKAGES; do
            echo -n "  → Updating $pkg... "
            if poetry update "$pkg" >/dev/null 2>&1; then
              echo "✅"
              UPDATED=$((UPDATED + 1))
            else
              echo "⚠️  (may be transitive dependency)"
              FAILED=$((FAILED + 1))
            fi
          done
          
          echo ""
          echo "📊 Summary: $UPDATED updated, $FAILED skipped/failed"
          echo ""
          echo "📝 Next steps:"
          echo "   1. Run 'poetry lock' to update lock file"
          echo "   2. Run 'task kubedash-audit' to verify fixes"
          
          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "💡 Note: Failed packages may be transitive dependencies."
            echo "   Try: poetry update (updates all dependencies)"
          fi
        elif [ "$NO_VULNS" -gt 0 ]; then
          echo "✅ No vulnerable packages found!"
          echo ""
          echo "All dependencies are up to date with no known vulnerabilities."
          echo ""
          echo "💡 To verify:"
          echo "   task kubedash-audit"
        else
          echo "⚠️  Could not parse audit results or determine vulnerability status"
          echo ""
          echo "💡 Showing current audit output:"
          poetry run pip-audit 2>&1 | head -30 || true
          echo ""
          echo "💡 To fix manually if vulnerabilities are found:"
          echo "   poetry update <package-name>"
          echo "   poetry lock"
        fi

  kubedash-security-all:
    desc: "Run all security checks (dependencies, secrets, code analysis)"
    silent: true
    cmds:
      - task: kubedash-audit
        run: true
        silent: true
      - task: kubedash-scan
        run: true
        silent: true
      - task: kubedash-security-check
        run: true
        silent: true
      - task: kubedash-secret-scan
        run: true
        silent: true
      - task: kubedash-bandit
        run: true
        silent: true
      - |
        echo "✅ All security checks completed (warnings may be present)"
        echo "💡 Note: safety check is deprecated - using pip-audit instead"
        

  kubedash-lint:
    desc: "Lint Kubedash"
    dir: 'src/kubedash'
    cmds:
      - poetry run isort .
      - poetry run flake8 .
      #- poetry run autoflake --remove-all-unused-imports --recursive --remove-unused-variables --in-place .
      - poetry run black --check .

  kubedash-dev-build:
    desc: "Build Kubedash devel docker image"
    cmds:
      - docker builder prune -f
      - task: kubedash-requirements
        run: true
      - rm -rf docker/kubedash/kubedash
      - cp -r src/kubedash docker/kubedash/kubedash
      - rm -f docker/kubedash/requirements.txt
      - cp src/kubedash/requirements.txt docker/kubedash/requirements.txt
      - rm -f docker/kubedash/gunicorn_conf.py
      - cp docker/kubedash/kubedash/gunicorn_conf.py docker/kubedash/gunicorn_conf.py
      - |
        docker build \
        -f docker/kubedash/Dockerfile \
        --build-arg BUILD_DATE={{.DATE}} \
        --build-arg VERSION={{.VERSION}}-devel \
        -t devopstales/kubedash:{{.VERSION}}-devel \
        docker/kubedash

  kubedash-dev-scan:
    desc: "Scan Kubedash devel docker image for vulnerabilities"
    cmds:
      - trivy -q i devopstales/kubedash:{{.VERSION}}-devel --ignore-unfixed --scanners vuln

  kubedash-dev-sign:
    desc: "Sign Kubedash devel docker image"
    cmds:
      - cosign sign --key $HOME/.gnupg/cosign.key devopstales/kubedash:{{.VERSION}}-devel -y

  kubedash-dev-push:
    desc: "Push Kubedash devel docker image"
    cmds:
      - docker push devopstales/kubedash:{{.VERSION}}-devel

  kubedash-dev-rm:
    desc: "Remove Kubedash devel docker image"
    cmds:
      - docker rmi devopstales/kubedash:{{.VERSION}}-devel

  kubedash-run:
    desc: "Run Kubedash docker container with kubedash.ini mount and port mappings"
    cmds:
      - |
        docker run -d \
        --name kubedash \
        -p 8080:8000 \
        -p 8443:8000 \
        -v $(pwd)/src/kubedash/kubedash.ini:/code/kubedash/kubedash.ini:ro \
        devopstales/kubedash:{{.VERSION}}

  kubedash-dev-run:
    desc: "Run Kubedash dev docker container with kubedash.ini mount and port mappings"
    cmds:
      - |
        docker run -d \
        --name kubedash \
        -p 8080:8000 \
        -p 8443:8000 \
        -v $(pwd)/src/kubedash/kubedash.ini:/code/kubedash/kubedash.ini:ro \
        devopstales/kubedash:{{.VERSION}}-devel

  kubedash-stop:
    desc: "Stop and remove Kubedash docker container"
    cmds:
      - docker stop kubedash || true
      - docker rm kubedash || true

  kubedash-dev:
    desc: "Build, scan, sign and push Kubedash devel docker image"
    cmds:
      - task: kubedash-dev-build
        run: true
      - task: kubedash-dev-scan
        run: true
      - task: kubedash-dev-push
        run: true

  kubedash-prod-build:
    desc: "Build Kubedash docker image"
    cmds:
      - docker builder prune -f
      - task: kubedash-requirements
        run: true
      - rm -rf docker/kubedash/kubedash
      - cp -r src/kubedash docker/kubedash/kubedash
      - rm -f docker/kubedash/requirements.txt
      - cp src/kubedash/requirements.txt docker/kubedash/requirements.txt
      - rm -f docker/kubedash/gunicorn_conf.py
      - cp docker/kubedash/kubedash/gunicorn_conf.py docker/kubedash/gunicorn_conf.py
      - |
        docker build \
        --build-arg BUILD_DATE={{.DATE}} \
        --build-arg VERSION={{.VERSION}} \
        -t devopstales/kubedash:{{.VERSION}} \
        -t devopstales/kubedash:latest \
        -t ghcr.io/devopstales/kubedash:{{.VERSION}} \
        -t ghcr.io/devopstales/kubedash:latest \
        docker/kubedash

  kubedash-prod-scan:
    desc: "Scan Kubedash Dockerfile for vulnerabilities"
    cmds:
      - trivy -q i --ignore-unfixed --scanners vuln devopstales/kubedash:{{.VERSION}}
      - trivy -q i --ignore-unfixed --format cyclonedx --output sbom.cdx.json --scanners vuln devopstales/kubedash:{{.VERSION}} 

  kubedash-prod-push:
    desc: "Push Kubedash docker image"
    cmds:
      - docker push devopstales/kubedash:{{.VERSION}}
      - docker push devopstales/kubedash:latest
      - docker push ghcr.io/devopstales/kubedash:{{.VERSION}}
      - docker push ghcr.io/devopstales/kubedash:latest
      - |
        oras attach docker.io/devopstales/kubedash:{{.VERSION}} \
        --artifact-type application/vnd.cyclonedx+json \
        --annotation "org.opencontainers.image.description=SBOM for kubedash" \
        --annotation "org.opencontainers.artifact.description=SBOM for kubedash" \
        --annotation "org.opencontainers.artifact.type=sbom" \
        --annotation "org.cyclonedx.bom.version=1.4" \
        --annotation "org.opencontainers.ref.name=kubedash-{{.VERSION}}" \
        --annotation "org.opencontainers.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        sbom.cdx.json
      - |
        oras attach docker.io/devopstales/kubedash:latest \
        --artifact-type application/vnd.cyclonedx+json \
        --annotation "org.opencontainers.image.description=SBOM for kubedash" \
        --annotation "org.opencontainers.artifact.description=SBOM for kubedash" \
        --annotation "org.opencontainers.artifact.type=sbom" \
        --annotation "org.cyclonedx.bom.version=1.4" \
        --annotation "org.opencontainers.ref.name=kubedash-{{.VERSION}}" \
        --annotation "org.opencontainers.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        sbom.cdx.json
      - |
        oras attach ghcr.io/devopstales/kubedash:{{.VERSION}} \
        --artifact-type application/vnd.cyclonedx+json \
        --annotation "org.opencontainers.image.description=SBOM for kubedash" \
        --annotation "org.opencontainers.artifact.description=SBOM for kubedash" \
        --annotation "org.opencontainers.artifact.type=sbom" \
        --annotation "org.cyclonedx.bom.version=1.4" \
        --annotation "org.opencontainers.ref.name=kubedash-{{.VERSION}}" \
        --annotation "org.opencontainers.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        sbom.cdx.json
      - |
        oras attach ghcr.io/devopstales/kubedash:latest \
        --artifact-type application/vnd.cyclonedx+json \
        --annotation "org.opencontainers.image.description=SBOM for kubedash" \
        --annotation "org.opencontainers.artifact.description=SBOM for kubedash" \
        --annotation "org.opencontainers.artifact.type=sbom" \
        --annotation "org.cyclonedx.bom.version=1.4" \
        --annotation "org.opencontainers.ref.name=kubedash-{{.VERSION}}" \
        --annotation "org.opencontainers.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        sbom.cdx.json
      - rm -f sbom.cdx.json

  kubedash-prod-sign:
    desc: "Sign Kubedash docker image"
    cmds:
      - cosign sign -y --upload=true --key $HOME/.gnupg/cosign.key devopstales/kubedash:{{.VERSION}}
      - cosign sign -y --upload=true --key $HOME/.gnupg/cosign.key devopstales/kubedash:latest
      - cosign sign -y --upload=true --key $HOME/.gnupg/cosign.key ghcr.io/devopstales/kubedash:{{.VERSION}}
      - cosign sign -y --upload=true --key $HOME/.gnupg/cosign.key ghcr.io/devopstales/kubedash:latest

  kubedash-prod-rm:
    desc: "Remove Kubedash docker image"
    cmds:
      - rm sbom.cdx.json
      - docker rmi devopstales/kubedash:{{.VERSION}}
      - docker rmi ghcr.io/devopstales/kubedash:{{.VERSION}}

  kubedash-prod:
    desc: "Build, scan, sign and push Kubedash docker image"
    cmds:
      - task: kubedash-security-all
        run: true
      - task: kubedash-prod-build
        run: true
      - task: kubedash-prod-scan
        run: true
      - task: kubedash-prod-push
        run: true
      - task: kubedash-prod-sign
        run: true
      - task: kubedash-prod-rm
        run: true

  kdlogin-build:
    desc: "Build kubectl-kdlogin"
    dir: 'src/kdlogin'
    cmds:
      - go mod tidy
      - >-
        if command -v gsed >/dev/null 2>&1; then
          gsed -i "s|AppVersion        = .*|AppVersion        = \"{{.VERSION}}\"|" main.go
        else
          sed -i '' "s|AppVersion        = .*|AppVersion        = \"{{.VERSION}}\"|" main.go
        fi
      - rm -rf dist/{windows,linux,osx,release}
      - rm -f dist/choco/*.nupkg
      - env CGO_ENABLED=0 go build -o dist/linux/kubectl-kdlogin main.go
      - env CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o dist/osx/kubectl-kdlogin main.go
      - env CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/windows/kubectl-kdlogin.exe main.go
    status:
      - test -f dist/linux/kubectl-kdlogin
      - test -f dist/osx/kubectl-kdlogin
      - test -f dist/windows/kubectl-kdlogin.exe

  kdlogin-scan:
   desc: "Scan kubectl-kdlogin for vulnerabilities"
   dir: 'src/kdlogin'
   cmds:
     - trivy -q fs .

  kdlogin-security:
   desc: "Run security checks on kubectl-kdlogin Go code"
   dir: 'src/kdlogin'
   cmds:
     - |
       echo "Checking for security issues in Go code..."
       if command -v gosec >/dev/null 2>&1; then
         gosec ./...
       else
         echo "⚠️  gosec not installed. Install with: go install github.com/securego/gosec/v2/cmd/gosec@latest"
       fi
     - |
       echo "Checking for hardcoded secrets..."
       if grep -r "password\|secret\|token" . --include="*.go" | grep -i "=.*['\"].*['\"]" | grep -v "validate\|json\|yaml"; then
         echo "⚠️  WARNING: Potential hardcoded credentials found"
       fi
     - |
       echo "Checking for unsafe command execution..."
       if grep -r "exec.Command" . --include="*.go" | grep -v "url\|xdg-open\|open\|rundll32"; then
         echo "⚠️  WARNING: Command execution detected - ensure input validation"
       fi

  helm-docs:
   desc: "Generate Helm Chart documentation"
   dir: 'deploy/charts'
   cmds:
    - helm-docs

  helm-build:
    desc: "Build Helm Chart"
    dir: 'deploy/charts'
    cmds:
      - helm dependency update
      - helm package --version {{.VERSION}} --app-version {{.VERSION}} .
      - helm push kubedash-{{.VERSION}}.tgz oci://registry-1.docker.io/devopstales &> push-metadata.txt

  helm-sign:
    desc: "Sign Helm Chart"
    dir: 'deploy/charts'
    cmds:
      - cosign sign-blob -y --key $HOME/.gnupg/cosign.key kubedash-{{.VERSION}}.tgz --bundle kubedash-{{.VERSION}}.tgz.cosign.bundle
      #- CHART_DIGEST=$(grep -oP "(?<=digest: sha256:)[a-z0-9]+" push-metadata.txt)
      #- cosign sign -y --key $HOME/.gnupg/cosign.key push-metadata.txt devopstales/helm-charts/kubedash:$CHART_DIGEST
      - rm -f push-metadata.txt
      - rm -f kubedash-{{.VERSION}}.tgz
      - rm -f kubedash-{{.VERSION}}.tgz.cosign.bundle

  helm-push:
    desc: "Push Helm Chart"
    dir: 'deploy/charts'
    cmds:
      - cr package .
      - git clone -b gh-pages git@github.com:devopstales/helm-charts.git gh-pages-temp
      - cd gh-pages-temp
      - cp ../.cr-release-packages/kubedash-4.0.0.tgz ./
      - git add .
      - git commit -m "Manual update for kubedash-4.0.0"
      - git push origin gh-pages
      - cd ..
      - rm -rf gh-pages-temp .cr-release-packages

  kdlogin-rm:
    desc: "Remove kubectl-kdlogin"
    dir: 'src/kdlogin'
    cmds:
      - rm -rf dist/{windows,linux,osx,release}
      - rm -f dist/choco/*.nupkg

  docs-gen:
    desc: "Generate documentation"
    cmds:
      - rm -rf .venv/
      - python3.11 -m venv .venv
      - .venv/bin/pip install -r docs/build/requirements.txt
      - helm-docs --chart-search-root deploy/charts --output-file configuration.md --template-files configuration.md.gotmpl
      - mv deploy/charts/configuration.md docs/installation/configuration.md
      - .venv/bin/mkdocs build

      #-  .venv/bin/mike deploy --push {{.VERSION}}
      #-  .venv/bin/mike deploy --push --update-aliases {{.VERSION}} latest
      #-  .venv/bin/mike set-default --push latest

  docs-run:
    desc: "Run local documentation server"
    cmds:
      - .venv/bin/mkdocs build
      - .venv/bin/python -m mkdocs serve

  security-pre-commit:
    desc: "Run security checks before commit (quick checks)"
    cmds:
      - task: kubedash-lint
        run: true
      - task: kubedash-security-check
        run: true
      - task: kdlogin-security
        run: true
      - echo "✅ Pre-commit security checks passed"

  security-ci:
    desc: "Run full security suite for CI/CD pipeline (strict mode - fails on vulnerabilities)"
    cmds:
      - task: kubedash-audit-strict
        run: true
      - task: kubedash-scan
        run: true
      - task: kubedash-security-check
        run: true
      - task: kdlogin-scan
        run: true
      - task: kdlogin-security
        run: true
      - task: kubedash-dev-scan
        run: true
      - |
        echo "✅ All CI security checks completed"
        echo "💡 Note: Using pip-audit instead of deprecated safety check"
