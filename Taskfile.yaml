version: '3'

# KubeDash root Taskfile — single entry point for all repo tasks.
#
#   CLI build tasks  (build, cross)   -> run in ./cli (dir: cli)
#   Dev env tasks    (dev-*)          -> docker-compose stack in ./dev
#
# Every task is CWD-independent: `dir` and the compose `-f` path resolve
# relative to this file's location, so `task <name>` works from any
# subdirectory of the repo.
#
# NOTE: every cmd/var string that embeds Go-template delimiters (`{{...}}`)
# is quoted — a YAML scalar that *starts* with `{{` is otherwise
# unparseable, so the quotes are load-bearing.

# `env` is merged into every task's environment, so it's the cleanest way to
# expose an overridable VERSION (task build VERSION=1.2.3) to the templates.
env:
  VERSION: "0.1.0"

vars:
  # Compose v2 invocation for the dev stack. {{.TASKFILE_DIR}} is the
  # directory holding this Taskfile (the repo root), so the -f path is
  # absolute and CWD-independent. Quoted (template delimiters).
  COMPOSE: "docker compose -f {{.TASKFILE_DIR}}/dev/docker-compose.yml"

  # ADR-0026: the TLS edge surface. EDGE_HTTPS is the host port the edge
  # listens on (the backstop scenario names :443 explicitly); TLS_CA is the
  # mkcert rootCA the e2e browser leg must verify against.
  EDGE_HTTPS: "443"
  TLS_CA: "{{.TASKFILE_DIR}}/dev/certs/rootCA.pem"

  # Multi-instance backend driver (dev/mux-up.sh) — see that script for the
  # two-process loop. {{.TASKFILE_DIR}} keeps it CWD-independent.
  BACKEND_MULTI: "{{.TASKFILE_DIR}}/dev/mux.sh"

  # Local kind cluster name (kind-up/kind-down). The kubeconfig context kind
  # generates is `kind-<name>`; the dev-stack flow registers this cluster in
  # the app's registry, so the dashboard's id:0 admin lens reaches it.
  KIND_CLUSTER: "kubedash-test"

  # dev-stack: backend interpreter + the dev DB/static paths. The DB creds and
  # URL match the compose stack's pinned defaults (dev/docker-compose.yml), so
  # no KUBEDASH_*_URL env is needed — the app's defaults already point here.
  BACKEND_PY: "{{.TASKFILE_DIR}}/backend/.venv/bin/python"
  DB_USER: "kubedash"
  DB_NAME: "kubedash"
  DB_URL: "postgresql+psycopg://kubedash:kubedash@localhost:5432/kubedash"
  STATIC_DIR: "{{.TASKFILE_DIR}}/backend/static"
  # Dev bootstrap admin (ADR-0021). Local auth is opt-in via these env vars;
  # the dev stack sets them so `task dev-stack` logs in as admin/admin. Prod
  # sets its own (or leaves them empty to disable local login).
  ADMIN_EMAIL: "admin@local"
  ADMIN_PASSWORD: "admin"

  # Go CLI: full import path of the package holding the `version` symbol.
  # -X needs the full import path; the bare package name "cmd.version" is
  # silently ignored by go tool link, so ldflags would no-op without warning.
  VERSIONSYM: github.com/org/kubedash-cli/cmd.version
  BIN: kubedash

tasks:
  # ---- CLI build (runs in ./cli) -------------------------------------------

  build:
    desc: "Build kubedash for the current platform (override version: task build VERSION=1.2.3)"
    dir: cli
    cmds:
      - "CGO_ENABLED=0 go build -ldflags \"-X {{.VERSIONSYM}}={{.VERSION}}\" -o {{.BIN}} ."

  cross:
    desc: "Cross-compile for 5 OS/arch combos into cli/dist/"
    dir: cli
    cmds:
      - |
        for t in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64; do
          os=${t%_*}; arch=${t#*_}; ext="";
          [ "$os" = "windows" ] && ext=".exe";
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags "-X {{.VERSIONSYM}}={{.VERSION}}" -o dist/{{.BIN}}-$os-$arch$ext .;
        done

  # ---- Dev environment (docker-compose stack in ./dev) ---------------------

  dev-up:
    # ADR-0026 R5 carve-out: this is the plain-HTTP fast path. A manual
    # `task backend-run` against it keeps KUBEDASH_COOKIE_SECURE=false; the
    # secure stack is `task dev-up-ssl` + `task dev-stack`.
    desc: "Start the dev environment (plain-HTTP fast path; add the TLS edge with dev-up-ssl)"
    cmds:
      - "{{.COMPOSE}} up -d"

  dev-tls-setup:
    desc: "Generate/verify dev TLS certs + hosts entry (ADR-0026, idempotent; hosts step needs sudo)"
    cmds:
      - "bash {{.TASKFILE_DIR}}/dev/setup-tls.sh generate"
      - "bash {{.TASKFILE_DIR}}/dev/setup-tls.sh hosts"

  dev-up-ssl:
    desc: "Start the dev stack INCLUDING the nginx TLS edge (https://kubedash.local:443)"
    cmds:
      - "{{.COMPOSE}} up -d"   # the nginx service is part of the same compose file

  dev-down:
    desc: "Stop the dev environment (keeps data volumes)"
    cmds:
      - "{{.COMPOSE}} down"

  dev-clean:
    desc: "Stop the dev environment AND delete data volumes (destructive)"
    cmds:
      - "{{.COMPOSE}} down -v"

  dev-logs:
    desc: "Tail dev environment logs"
    cmds:
      - "{{.COMPOSE}} logs -f"

  dev-ps:
    desc: "Show dev environment status/health"
    cmds:
      - "{{.COMPOSE}} ps"

  # ---- Local kind cluster (dashboard backstop: real K8s API + metrics) -----
  #
  # The dashboard's /metrics/summary needs a live cluster; the e2e/dev flows
  # use the synthetic id:0 admin cluster, but the allocation rollup and the
  # metrics-server degrade path are only proven against a real API. kind-up
  # is idempotent: it creates the cluster only if absent, then applies the
  # metrics-server manifest (with kind's kubelet TLS quirks handled) and
  # waits for the apiservice to be available.

  kind-up:
    desc: "Create the local kind cluster (if absent) + install metrics-server (idempotent)"
    cmds:
      - task: _kind-cluster
      - task: _kind-metrics-server

  kind-down:
    desc: "Delete the local kind cluster (destructive)"
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER}}

  _kind-cluster:
    internal: true
    cmds:
      - kind get clusters | grep -q '^{{.KIND_CLUSTER}}$' || kind create cluster --name {{.KIND_CLUSTER}}

  _kind-metrics-server:
    internal: true
    cmds:
      - kubectl --context kind-{{.KIND_CLUSTER}} apply --server-side -f {{.TASKFILE_DIR}}/dev/metrics-server.yaml
      - kubectl --context kind-{{.KIND_CLUSTER}} -n kube-system rollout status deploy/metrics-server --timeout=120s
      - kubectl --context kind-{{.KIND_CLUSTER}} wait --for=condition=available apiservice/v1beta1.metrics.k8s.io --timeout=120s

  # ---- Backend (Flask app, runs on the host against the dev stack) ----------
  #
  # The app's default DB/Redis URLs already point at the compose stack's
  # pinned ports, so no KUBEDASH_*_URL is needed for the stock setup.
  #
  # Multi-instance: each instance gets its own port and KUBEDASH_REPLICA_ID
  # (the advisory-lock key is hashtext(replica_id)). Watch leadership with
  # `task multi-logs`, or kill the leader and watch the follower promote
  # within ~10 s (stale_seconds) — `task db-shell` shows the leader_lease
  # row directly.

  backend-run:
    desc: "Run one backend instance on :8080 (leader role, starts RQ worker + Leader)"
    dir: backend
    cmds:
      # Local-admin bootstrap (ADR-0021): admin@local/admin — without these
      # the login 403s with LOCAL_AUTH_DISABLED.
      # ADR-0025: the dev stack speaks http://localhost, where a Secure cookie
      # is stored but never sent back. Production stays Secure (the default).
      # KUBEDASH_STATIC_DIR points at the built SPA (task fe-build output);
      # without it the catch-all 404s (the container default /app/static
      # doesn't exist on a host checkout).
      - "KUBEDASH_ROLE=leader KUBEDASH_REPLICA_ID=local KUBEDASH_BOOTSTRAP_ADMIN_EMAIL=admin@local KUBEDASH_BOOTSTRAP_ADMIN_PASSWORD=admin KUBEDASH_COOKIE_SECURE=false KUBEDASH_STATIC_DIR={{.TASKFILE_DIR}}/frontend/dist .venv/bin/python wsgi.py"

  backend-run-worker:
    desc: "Run one backend instance on :8080 in worker-only role (no Leader/RQ worker)"
    dir: backend
    cmds:
      - "KUBEDASH_ROLE=worker KUBEDASH_REPLICA_ID=local .venv/bin/python wsgi.py"

  multi-up:
    desc: "Start two backend instances (:8081 + :8082) for leader-election tests"
    cmds:
      - "{{.BACKEND_MULTI}} up"

  multi-down:
    desc: "Stop the multi-instance backend instances"
    cmds:
      - "{{.BACKEND_MULTI}} down"

  multi-logs:
    desc: "Tail the multi-instance backend logs"
    cmds:
      - "{{.BACKEND_MULTI}} logs"

  failover:
    desc: "Kill the current leader; watch the follower promote within ~10 s (task multi-logs)"
    cmds:
      - "{{.BACKEND_MULTI}} failover"

  db-shell:
    desc: "Open a Postgres shell (observe leader_lease: SELECT * FROM leader_lease)"
    cmds:
      - "{{.COMPOSE}} exec postgres psql -U ${KUBEDASH_DB_USER:-kubedash} -d ${KUBEDASH_DB_NAME:-kubedash}"

  # ---- One-command local env (compose + schema + backend) -------------------
  #
  # Brings up the full local dev loop in one shot: the compose data stores,
  # the SQLAlchemy schema (db.create_all — dev-only; prod uses Alembic), and
  # the leader backend on :8080 with the bootstrap admin + static dir wired.
  # Idempotent: safe to re-run (compose up -d is a no-op when healthy; the
  # schema create_all is idempotent; the backend rebinds the port).
  #
  #   task dev-stack          # foreground (Ctrl-C stops the backend; compose stays up)
  #   task dev-stack-down     # stop the backend + compose stack

  dev-stack:
    desc: "Start the full local env: compose + schema + backend behind the TLS edge (bootstrap admin, static wired)"
    cmds:
      # ADR-0026: the certs are a *read* precondition — fail fast with the
      # named fix instead of starting a backend that cannot serve TLS.
      - "test -f {{.TLS_CA}} || (echo 'run task dev-tls-setup first (dev/certs missing)' && exit 1)"
      - "{{.COMPOSE}} up -d"
      # Wait for Postgres to accept connections (compose 'healthy' covers the
      # data store, but the app needs the TCP port answering).
      - "{{.COMPOSE}} exec -T postgres pg_isready -U {{.DB_USER}} -d {{.DB_NAME}}"
      # Idempotent: free :8080 from a prior dev-stack backend before rebind
      # (no-op if nothing is listening). pkill catches zombie wsgi.py children
      # that survive the parent's SIGKILL (lsof only kills the port holder).
      # lsof instead of fuser: macOS's fuser prints usage to stderr on a
      # "file" argument and only kills the listener, not the process group.
      - "lsof -ti tcp:8080 | xargs kill 2>/dev/null || true"
      - "pkill -f 'python.*wsgi.py' 2>/dev/null || true"
      - "sleep 1"
      # Build + sync the SPA into backend/static so the first boot serves the
      # current bundle (KUBEDASH_STATIC_DIR). fe-check stays the explicit
      # air-gap gate — dev-stack only needs a working bundle.
      - task: fe-build
      - task: fe-sync
      # Create the schema (dev shortcut — prod runs Alembic migrations).
      - task: backend-create-schema
      # Start the leader backend (foreground — the task blocks until Ctrl-C).
      - task: backend-stack-run

  dev-stack-down:
    desc: "Stop the local env backend (task dev-stack) + compose stack"
    cmds:
      - "lsof -ti tcp:8080 | xargs kill 2>/dev/null || true"
      - "pkill -f 'python.*wsgi.py' 2>/dev/null || true"
      - "{{.COMPOSE}} down"

  # Internal: create the SQLAlchemy schema from the backend dir (where the
  # `app` package resolves). Dev shortcut — prod runs Alembic migrations.
  backend-create-schema:
    internal: true
    dir: backend
    cmds:
      - >
        .venv/bin/python -c
        "from app import create_app; from app.extensions import db;
        a = create_app({'DATABASE_URL': '{{.DB_URL}}'});
        a.app_context().push(); db.create_all(); print('schema ready')"

  # Internal: the dev-stack backend run (separate task so the `dir: backend`
  # scoping + env block stay clean). Called by dev-stack, not meant to be
  # invoked directly.
  backend-stack-run:
    internal: true
    dir: backend
    env:
      KUBEDASH_BOOTSTRAP_ADMIN_EMAIL: "{{.ADMIN_EMAIL}}"
      KUBEDASH_BOOTSTRAP_ADMIN_PASSWORD: "{{.ADMIN_PASSWORD}}"
      KUBEDASH_STATIC_DIR: "{{.STATIC_DIR}}"
      KUBEDASH_ROLE: "leader"
      KUBEDASH_REPLICA_ID: "local"
      # ADR-0026: the dev stack now runs behind the TLS edge — the Secure
      # cookie is honest end-to-end (browser leg HTTPS, internal leg HTTPS
      # via :8443). The plain-HTTP carve-out is `task dev-up` + a manual
      # `backend-run` (KUBEDASH_COOKIE_SECURE=false, no TLS).
      KUBEDASH_COOKIE_SECURE: "true"
      # ADR-0026: the dev-stack backend serves :8443 over TLS — the nginx
      # edge's upstream target (proxy_ssl_verify checks it against the mkcert
      # rootCA). Single-port trade-off: with the cert set, the dev backend
      # serves 8443-over-TLS and NOT plain :8080 (see wsgi.py __main__).
      KUBEDASH_SSL_CERT: "{{.TASKFILE_DIR}}/dev/certs/backend.pem"
      KUBEDASH_SSL_KEY: "{{.TASKFILE_DIR}}/dev/certs/backend-key.pem"
      KUBEDASH_TLS_EDGE: "true"
      FLASK_RUN_PORT: "8443"
    cmds:
      # Double-fork so the backend survives `task` exiting: the intermediate
      # shell exits immediately, re-parenting the backend to init (macOS has
      # no setsid; nohup alone was reaped with the task's process group).
      - "sh -c 'nohup .venv/bin/python wsgi.py > /tmp/kubedash-backend.log 2>&1 &'"
      - "sleep 2"
      - "echo 'Backend started (PID $(pgrep -f 'python.*wsgi.py' | head -1)). Logs: /tmp/kubedash-backend.log'"
      - "cat /tmp/kubedash-backend.log"

  # ---- E2E (Playwright auth-smoke, no kind needed) ---------------------------
  #
  # Runs the local auth-smoke spec against the dev-stack backend on :8080.
  # The stack must be up first (task dev-stack in another terminal, or the
  # backend left running). Asserts the three seams unit tests miss: SPA shell
  # render (no JS crash), local login → profile + synthetic cluster, and the
  # wrong-password error path.
  #
  #   task dev-stack            # terminal 1 (keep running)
  #   task e2e                  # terminal 2

  e2e:
    desc: "Run the Playwright auth-smoke e2e against the dev-stack backend (:8080)"
    dir: frontend
    cmds:
      - "corepack pnpm exec playwright test e2e/auth-smoke.spec.ts"

  e2e-ssl:
    desc: "Run the Playwright auth-smoke e2e against https://kubedash.local:443 (ADR-0026 backstop)"
    dir: frontend
    env:
      E2E_BASE_URL: "https://kubedash.local:{{.EDGE_HTTPS}}"
      # The mkcert CA: today the Chromium launched by Playwright inherits it
      # from the host keychain (`sudo mkcert -install`), so no launch args are
      # needed — this var is kept for a non-keychain fallback (e.g. CI) and
      # for Node-side clients. Verified by the 2026-10-24 backstop run.
      E2E_TLS_CA: "{{.TLS_CA}}"
    cmds:
      - "corepack pnpm exec playwright test e2e/auth-smoke.spec.ts"

  # ---- Frontend (offline dev loop, ADR-0020 air-gap) -------------------------
  #
  # Mirrors the Dockerfile's `COPY --from=frontend /build/dist ./static`:
  # fe-sync places the built bundle where the Flask app serves it from
  # (KUBEDASH_STATIC_DIR, default backend/static). fe-check is ADR-0020's
  # frontend proof — the same script CI calls directly.

  fe-install:
    desc: "Install frontend dependencies (pnpm, frozen lockfile)"
    dir: frontend
    cmds:
      - "corepack pnpm install --frozen-lockfile"

  fe-build:
    desc: "Typecheck + lint + build the frontend (frontend/dist)"
    dir: frontend
    cmds:
      - "corepack pnpm exec tsc --noEmit && corepack pnpm exec eslint src && corepack pnpm build"

  fe-sync:
    desc: "Sync frontend/dist -> backend/static (KUBEDASH_STATIC_DIR default)"
    cmds:
      - "rm -rf {{.TASKFILE_DIR}}/backend/static && cp -r {{.TASKFILE_DIR}}/frontend/dist {{.TASKFILE_DIR}}/backend/static"
      - |
        echo "Synced. index.html is no-cache, assets/ is immutable (ADR-0006 OD-4)."
        echo "If this step failed after the rm, re-run 'task fe-build fe-sync'"

  fe-dev:
    desc: "Run the vite dev server (API proxied to http://localhost:8080)"
    dir: frontend
    cmds:
      - "corepack pnpm start"

  fe-check:
    desc: "Air-gap check: no https?:// or //cdn. references in the built bundle (ADR-0020)"
    requires: { vars: [] }
    deps: [fe-build]
    cmds:
      - "node {{.TASKFILE_DIR}}/tests/fe-airgap-check.mjs {{.TASKFILE_DIR}}/frontend/dist {{if .ALLOW}}--allow \"{{.ALLOW}}\"{{end}}"
