version: '3'

# KubeDash root Taskfile — single entry point for all repo tasks.
#
#   CLI build tasks  (build, cross)   -> run in ./cli (dir: cli)
#   Dev env tasks    (dev-*)          -> docker-compose stack in ./dev
#
# Every task is CWD-independent: `dir` and the compose `-f` path resolve
# relative to this file's location, so `task <name>` works from any
# subdirectory of the repo.
#
# NOTE: every cmd/var string that embeds Go-template delimiters (`{{...}}`)
# is quoted — a YAML scalar that *starts* with `{{` is otherwise
# unparseable, so the quotes are load-bearing.

# `env` is merged into every task's environment, so it's the cleanest way to
# expose an overridable VERSION (task build VERSION=1.2.3) to the templates.
env:
  VERSION: "0.1.0"

vars:
  # Compose v2 invocation for the dev stack. {{.TASKFILE_DIR}} is the
  # directory holding this Taskfile (the repo root), so the -f path is
  # absolute and CWD-independent. Quoted (template delimiters).
  COMPOSE: "docker compose -f {{.TASKFILE_DIR}}/dev/docker-compose.yml"

  # Multi-instance backend driver (dev/mux-up.sh) — see that script for the
  # two-process loop. {{.TASKFILE_DIR}} keeps it CWD-independent.
  BACKEND_MULTI: "{{.TASKFILE_DIR}}/dev/mux.sh"

  # dev-stack: backend interpreter + the dev DB/static paths. The DB creds and
  # URL match the compose stack's pinned defaults (dev/docker-compose.yml), so
  # no KUBEDASH_*_URL env is needed — the app's defaults already point here.
  BACKEND_PY: "{{.TASKFILE_DIR}}/backend/.venv/bin/python"
  DB_USER: "kubedash"
  DB_NAME: "kubedash"
  DB_URL: "postgresql+psycopg://kubedash:kubedash@localhost:5432/kubedash"
  STATIC_DIR: "{{.TASKFILE_DIR}}/backend/static"
  # Dev bootstrap admin (ADR-0021). Local auth is opt-in via these env vars;
  # the dev stack sets them so `task dev-stack` logs in as admin/admin. Prod
  # sets its own (or leaves them empty to disable local login).
  ADMIN_EMAIL: "admin@local"
  ADMIN_PASSWORD: "admin"

  # Go CLI: full import path of the package holding the `version` symbol.
  # -X needs the full import path; the bare package name "cmd.version" is
  # silently ignored by go tool link, so ldflags would no-op without warning.
  VERSIONSYM: github.com/org/kubedash-cli/cmd.version
  BIN: kubedash

tasks:
  # ---- CLI build (runs in ./cli) -------------------------------------------

  build:
    desc: "Build kubedash for the current platform (override version: task build VERSION=1.2.3)"
    dir: cli
    cmds:
      - "CGO_ENABLED=0 go build -ldflags \"-X {{.VERSIONSYM}}={{.VERSION}}\" -o {{.BIN}} ."

  cross:
    desc: "Cross-compile for 5 OS/arch combos into cli/dist/"
    dir: cli
    cmds:
      - |
        for t in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64; do
          os=${t%_*}; arch=${t#*_}; ext="";
          [ "$os" = "windows" ] && ext=".exe";
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags "-X {{.VERSIONSYM}}={{.VERSION}}" -o dist/{{.BIN}}-$os-$arch$ext .;
        done

  # ---- Dev environment (docker-compose stack in ./dev) ---------------------

  dev-up:
    desc: "Start the dev environment (postgres, redis, prometheus, grafana, jaeger)"
    cmds:
      - "{{.COMPOSE}} up -d"

  dev-down:
    desc: "Stop the dev environment (keeps data volumes)"
    cmds:
      - "{{.COMPOSE}} down"

  dev-clean:
    desc: "Stop the dev environment AND delete data volumes (destructive)"
    cmds:
      - "{{.COMPOSE}} down -v"

  dev-logs:
    desc: "Tail dev environment logs"
    cmds:
      - "{{.COMPOSE}} logs -f"

  dev-ps:
    desc: "Show dev environment status/health"
    cmds:
      - "{{.COMPOSE}} ps"

  # ---- Backend (Flask app, runs on the host against the dev stack) ----------
  #
  # The app's default DB/Redis URLs already point at the compose stack's
  # pinned ports, so no KUBEDASH_*_URL is needed for the stock setup.
  #
  # Multi-instance: each instance gets its own port and KUBEDASH_REPLICA_ID
  # (the advisory-lock key is hashtext(replica_id)). Watch leadership with
  # `task multi-logs`, or kill the leader and watch the follower promote
  # within ~10 s (stale_seconds) — `task db-shell` shows the leader_lease
  # row directly.

  backend-run:
    desc: "Run one backend instance on :8080 (leader role, starts RQ worker + Leader)"
    dir: backend
    cmds:
      - "KUBEDASH_ROLE=leader KUBEDASH_REPLICA_ID=local .venv/bin/python wsgi.py"

  backend-run-worker:
    desc: "Run one backend instance on :8080 in worker-only role (no Leader/RQ worker)"
    dir: backend
    cmds:
      - "KUBEDASH_ROLE=worker KUBEDASH_REPLICA_ID=local .venv/bin/python wsgi.py"

  multi-up:
    desc: "Start two backend instances (:8081 + :8082) for leader-election tests"
    cmds:
      - "{{.BACKEND_MULTI}} up"

  multi-down:
    desc: "Stop the multi-instance backend instances"
    cmds:
      - "{{.BACKEND_MULTI}} down"

  multi-logs:
    desc: "Tail the multi-instance backend logs"
    cmds:
      - "{{.BACKEND_MULTI}} logs"

  failover:
    desc: "Kill the current leader; watch the follower promote within ~10 s (task multi-logs)"
    cmds:
      - "{{.BACKEND_MULTI}} failover"

  db-shell:
    desc: "Open a Postgres shell (observe leader_lease: SELECT * FROM leader_lease)"
    cmds:
      - "{{.COMPOSE}} exec postgres psql -U ${KUBEDASH_DB_USER:-kubedash} -d ${KUBEDASH_DB_NAME:-kubedash}"

  db-migrate:
    desc: "Apply Alembic migrations to the dev DB (flask db upgrade; idempotent)"
    dir: backend
    cmds:
      - "DATABASE_URL={{.DB_URL}} uv run flask db upgrade"

  # ---- One-command local env (compose + schema + backend) -------------------
  #
  # Brings up the full local dev loop in one shot: the compose data stores,
  # the SQLAlchemy schema (Alembic migrations — the same path prod uses; a
  # legacy create_all-era dev DB is healed via stamp base + upgrade), and
  # the leader backend on :8080 with the bootstrap admin + static dir wired.
  # Idempotent: safe to re-run (compose up -d is a no-op when healthy; the
  # migration upgrade is a no-op at head; the backend rebinds the port).
  #
  #   task dev-stack          # foreground (Ctrl-C stops the backend; compose stays up)
  #   task dev-stack-down     # stop the backend + compose stack

  dev-stack:
    desc: "Start the full local env: compose + schema + frontend build/sync + backend on :8080 (bootstrap admin, static wired)"
    cmds:
      - "{{.COMPOSE}} up -d"
      # Wait for Postgres to accept connections (compose 'healthy' covers the
      # data store, but the app needs the TCP port answering).
      - "{{.COMPOSE}} exec -T postgres pg_isready -U {{.DB_USER}} -d {{.DB_NAME}}"
      # Idempotent: free :8080 from a prior dev-stack backend before rebind
      # (no-op if nothing is listening). pkill catches zombie wsgi.py children
      # that survive the parent's SIGKILL (fuser only kills the port holder).
      - "fuser -k 8080/tcp 2>/dev/null || true"
      - "pkill -f 'python.*wsgi.py' 2>/dev/null || true"
      - "sleep 1"
      # Build the SPA and sync it to backend/static before the backend starts,
      # so the served UI is never stale (fe-sync wipes static/, so build first).
      - task: fe-build
      - task: fe-sync
      # Create the schema (dev shortcut — prod runs Alembic migrations).
      - task: backend-create-schema
      # Start the leader backend (foreground — the task blocks until Ctrl-C).
      - task: backend-stack-run

  dev-stack-down:
    desc: "Stop the local env backend (task dev-stack) + compose stack"
    cmds:
      - "fuser -k 8080/tcp 2>/dev/null || true"
      - "{{.COMPOSE}} down"

  # Internal: bring the dev DB schema to migration head from the backend dir
  # (where the `app` package resolves). Migration-managed — prod and dev now
  # share the Alembic path. Three shapes:
  #   (1) alembic_version present          -> upgrade (idempotent at head)
  #   (2) tables present, no alembic_version (legacy create_all-era dev DB)
  #                                          -> stamp 6feadb091ff4 + upgrade.
  #      The stamp target is the ADR-0021 revision, NOT the base: the base's
  #      upgrade() does unguarded create_table('users'...), so it must be
  #      marked APPLIED (skipped) on a DB that already has the tables; the
  #      two revisions after 6feadb091ff4 are idempotent against
  #      create_all-shaped tables (guarded has_table/column checks), and data
  #      is preserved.
  #   (3) empty database (compose-created, no tables at all) -> upgrade from
  #      the base (the normal migration path).
  backend-create-schema:
    internal: true
    dir: backend
    cmds:
      - |
        set -euo pipefail
        export DATABASE_URL='{{.DB_URL}}'
        # set -e is off here so the probe's non-zero exit (legacy/fresh)
        # doesn't abort the task before the case runs; the branch commands
        # are the real gates.
        set +e
        state=$(uv run python -c "
        from sqlalchemy import create_engine, inspect
        e = create_engine('${DATABASE_URL}')
        t = set(inspect(e).get_table_names())
        if 'alembic_version' in t: print('managed')
        elif 'users' in t: print('legacy')
        else: print('fresh')
        ")
        set -e
        case "$state" in
          managed) uv run flask db upgrade ;;
          legacy)
            echo "Legacy create_all-era dev DB (no alembic_version): stamping 6feadb091ff4, then upgrading"
            uv run flask db stamp 6feadb091ff4
            uv run flask db upgrade
            ;;
          *)
            echo "Fresh database: upgrading from the base revision"
            uv run flask db upgrade
            ;;
        esac

  # Internal: the dev-stack backend run (separate task so the `dir: backend`
  # scoping + env block stay clean). Called by dev-stack, not meant to be
  # invoked directly.
  backend-stack-run:
    internal: true
    dir: backend
    env:
      KUBEDASH_BOOTSTRAP_ADMIN_EMAIL: "{{.ADMIN_EMAIL}}"
      KUBEDASH_BOOTSTRAP_ADMIN_PASSWORD: "{{.ADMIN_PASSWORD}}"
      KUBEDASH_STATIC_DIR: "{{.STATIC_DIR}}"
      KUBEDASH_ROLE: "leader"
      KUBEDASH_REPLICA_ID: "local"
    cmds:
      - "nohup .venv/bin/python wsgi.py > /tmp/kubedash-backend.log 2>&1 &"
      # Poll for actual readiness (Flask dev-server startup line or a
      # listening port) instead of a fixed sleep — the 2 s sleep was too
      # short on loaded machines, leaving the log at just `nohup: ignoring
      # input` when it was `cat`'d.
      - |
        for i in $(seq 1 30); do
          if grep -q "Running on" /tmp/kubedash-backend.log 2>/dev/null; then break; fi
          if fuser 8080/tcp >/dev/null 2>&1; then break; fi
          sleep 1
        done
      - "echo \"Backend ready (PID $(pgrep -f 'python.*wsgi.py' | head -1)). Logs: /tmp/kubedash-backend.log\""
      - "tail -20 /tmp/kubedash-backend.log"

  # ---- Test tasks (unit / smoke / e2e) ---------------------------------------
  #
  # All three push their results to the dev Prometheus Pushgateway when it is
  # reachable (PROMETHEUS_PUSHGATEWAY_URL set), so Grafana always shows the
  # last run. The push is a silent no-op when the gateway is absent, so the
  # docker-free loop (test-unit) still works on a bare host.
  #
  #   task test-unit                 # fast pytest unit loop
  #   task test-unit FULL=1          # + the container-backed integration tier
  #   task test-unit FILE=tests/api/test_local_auth.py   # narrow to a path/glob
  #   task test-smoke                # Playwright auth smoke (needs task dev-stack)
  #   task test-e2e                  # Playwright OIDC+kind journey (CI parity)
  #
  # Prometheus wiring: dev/docker-compose.yml runs the pushgateway; dev/
  # prometheus/prometheus.yml scrapes it (job_name: pushgateway).

  test-unit:
    desc: "Run the backend pytest unit loop (-m 'not integration'); FULL=1 adds the integration tier, FILE=... narrows; pushes results to Pushgateway when reachable"
    dir: backend
    env:
      PROMETHEUS_PUSHGATEWAY_URL: "http://localhost:{{.PUSHGATEWAY_PORT | default 9091}}"
      PROMETHEUS_PUSHGATEWAY_JOB: "kubedash-unit"
    cmds:
      - >
        {{if .FULL}}uv run pytest -v --metrics {{.FILE}}{{else}}uv run pytest
        -m "not integration" --metrics {{.FILE}}{{end}}

  test-smoke:
    desc: "Run the Playwright auth-smoke e2e against the dev-stack backend (:8080); needs task dev-stack running; pushes results to Pushgateway"
    dir: frontend
    env:
      E2E_BASE_URL: "http://localhost:8080"
      PROMETHEUS_PUSHGATEWAY_URL: "http://localhost:{{.PUSHGATEWAY_PORT | default 9091}}"
    cmds:
      - "corepack pnpm exec playwright test e2e/auth-smoke.spec.ts --reporter=list,json"
      - "uv run --project {{.TASKFILE_DIR}}/backend python {{.TASKFILE_DIR}}/scripts/prometheus-push-e2e.py --report playwright-report.json --job kubedash-smoke"

  test-e2e:
    desc: "Run the full Playwright e2e (OIDC + kind-cluster journey); CI parity — needs kind + mock IdP (see e2e.yaml); pushes results to Pushgateway"
    dir: frontend
    env:
      E2E_BASE_URL: "http://localhost:8080"
      PROMETHEUS_PUSHGATEWAY_URL: "http://localhost:{{.PUSHGATEWAY_PORT | default 9091}}"
    cmds:
      - "corepack pnpm exec playwright test e2e/smoke.spec.ts --reporter=list,json"
      - "uv run --project {{.TASKFILE_DIR}}/backend python {{.TASKFILE_DIR}}/scripts/prometheus-push-e2e.py --report playwright-report.json --job kubedash-e2e"

  # ---- Code quality / security (lint, type, duplication, CVEs) ----------------
  #
  # Each task runs the tool, reduces its output to gauges, and pushes them to
  # the dev Pushgateway (job: kubedash-lint / kubedash-quality / kubedash-security).
  # The push is a silent no-op when the gateway is absent. ruff/mypy/trivy/jscpd
  # are all already in the toolchain (ruff+mypy are dev deps; trivy/jscpd are on
  # PATH). See .skillgrid/ARCHITECTURE.md §6 for the query-only observability model.
  #
  #   task test-lint       # ruff + mypy -> kubedash-lint
  #   task test-quality    # jscpd duplication -> kubedash-quality
  #   task test-security   # trivy CVEs -> kubedash-security (IMAGE=... to scan an image)

  test-lint:
    desc: "Run ruff + mypy and push per-rule violation + type-error counts to Pushgateway (job kubedash-lint)"
    env:
      PROMETHEUS_PUSHGATEWAY_URL: "http://localhost:{{.PUSHGATEWAY_PORT | default 9091}}"
    cmds:
      - "python3 {{.TASKFILE_DIR}}/scripts/collect-lint.py"

  test-quality:
    desc: "Run jscpd over the frontend and push duplication % + clone count to Pushgateway (job kubedash-quality)"
    env:
      PROMETHEUS_PUSHGATEWAY_URL: "http://localhost:{{.PUSHGATEWAY_PORT | default 9091}}"
    cmds:
      - "python3 {{.TASKFILE_DIR}}/scripts/collect-quality.py"

  test-security:
    desc: "Run trivy and push CVE counts by severity to Pushgateway (job kubedash-security); IMAGE=... scans an image, else filesystem scan"
    env:
      PROMETHEUS_PUSHGATEWAY_URL: "http://localhost:{{.PUSHGATEWAY_PORT | default 9091}}"
    cmds:
      - "python3 {{.TASKFILE_DIR}}/scripts/collect-security.py {{if .IMAGE}}--image {{.IMAGE}}{{end}}"

  # ---- Frontend (offline dev loop, ADR-0020 air-gap) -------------------------
  #
  # Mirrors the Dockerfile's `COPY --from=frontend /build/dist ./static`:
  # fe-sync places the built bundle where the Flask app serves it from
  # (KUBEDASH_STATIC_DIR, default backend/static). fe-check is ADR-0020's
  # frontend proof — the same script CI calls directly.

  fe-install:
    desc: "Install frontend dependencies (pnpm, frozen lockfile)"
    dir: frontend
    cmds:
      - "corepack pnpm install --frozen-lockfile"

  fe-build:
    desc: "Typecheck + lint + build the frontend (frontend/dist)"
    dir: frontend
    cmds:
      - "corepack pnpm exec tsc --noEmit && corepack pnpm exec eslint src && corepack pnpm build"

  fe-sync:
    desc: "Sync frontend/dist -> backend/static (KUBEDASH_STATIC_DIR default)"
    cmds:
      - "rm -rf {{.TASKFILE_DIR}}/backend/static && cp -r {{.TASKFILE_DIR}}/frontend/dist {{.TASKFILE_DIR}}/backend/static"
      - |
        echo "Synced. index.html is no-cache, assets/ is immutable (ADR-0006 OD-4)."
        echo "If this step failed after the rm, re-run 'task fe-build fe-sync'"

  fe-dev:
    desc: "Run the vite dev server (API proxied to http://localhost:8080)"
    dir: frontend
    cmds:
      - "VITE_API_BASE=http://localhost:8080 corepack pnpm start"

  fe-check:
    desc: "Air-gap check: no https?:// or //cdn. references in the built bundle (ADR-0020)"
    requires: { vars: [] }
    deps: [fe-build]
    cmds:
      - "node {{.TASKFILE_DIR}}/scripts/fe-airgap-check.mjs {{.TASKFILE_DIR}}/frontend/dist {{if .ALLOW}}--allow \"{{.ALLOW}}\"{{end}}"
