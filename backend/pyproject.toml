[project]
name = "kubedash-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0",
  # Flask-Smorest is still 0.47.x on PyPI; >=1.0 does not exist. A 1.0 pin would
  # make `uv sync` unresolvable, so pin the latest 0.x series instead.
  "flask-smorest>=0.47,<1.0",
  "flask-sqlalchemy>=3.1",
  "flask-migrate>=4.0",
  "flask-socketio>=5.3",
  "flask-limiter>=3.5",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "rq>=1.16",
  "kubernetes>=29.0",
  "httpx>=0.26",
  "authlib>=1.3",
  "pyjwt>=2.8",
  "gunicorn>=21.2",
  "flask-redis>=0.4,<1.0",
  "cryptography>=42",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0.12.20260906",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "testcontainers>=4.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "types-redis",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Alembic-generated files are not hand-edited (flask db migrate owns them);
# the generated import order and 119-char column lines are not lint errors.
[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501", "I001"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
# flask_migrate, flask_redis, flask_smorest, authlib ship no stubs or py.typed
# marker. jwt (pyjwt) ships inline types, no override needed.
module = ["flask_migrate", "flask_redis", "flask_smorest.*", "authlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# app.api.auth: flask-smorest 0.47's Api is untyped (Any) and its Blueprint
# decorators are untyped, so domain Api classes and their view functions
# inherit Any. Silence exactly those codes for the auth/api module; the
# security core and errors modules stay fully checked.
module = ["app.api.auth"]
disable_error_code = ["misc", "untyped-decorator", "no-untyped-def"]

[[tool.mypy.overrides]]
# flask-smorest 0.47's Api is untyped (Any) and its Blueprint decorators are
# untyped, so domain Api classes and their view functions inherit Any — same
# treatment as app.api.auth. The service layer (app.services.k8s_client) stays
# fully checked.
module = ["app.api.clusters"]
disable_error_code = ["misc", "untyped-decorator", "no-untyped-def"]

[[tool.mypy.overrides]]
# R9 stub API surface (Task 6): flask-smorest 0.47's Api is untyped (Any) and
# its Blueprint decorators are untyped — same treatment as app.api.auth /
# app.api.clusters. The stub modules' 501 handlers and ADR docstrings stay
# fully checked; only the Smorest-inherited codes are silenced.
module = [
    "app.api.logs", "app.api.metrics", "app.api.traces", "app.api.audit",
    "app.api.permissions", "app.api.namespaces", "app.api.access",
    "app.api.kubeconfig", "app.api.admin", "app.api.kubectl_auth",
    "app.api.resources", "app.api.scim.users", "app.api.scim.groups",
    "app.api.aggregated.projects", "app.api.aggregated.sso_users",
    "app.api.aggregated.sso_groups",
]
disable_error_code = ["misc", "untyped-decorator", "no-untyped-def"]

[[tool.mypy.overrides]]
# kubernetes ships no py.typed marker (no inline types in the 30.x line);
# its client objects are typed as Any at the seam — the pool's factory seam
# keeps the rest of the codebase fully checked.
module = ["kubernetes.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# flask_sqlalchemy is py.typed, but the db.Model attribute is assigned in
# __init__ (untyped -> Any), so `class X(db.Model)` trips name-defined +
# subclass-Any under --strict. Silence exactly those two codes for model
# classes; everything else in the models stays fully checked.
module = ["app.models.*"]
disable_error_code = ["name-defined", "misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the `app` package importable when pytest runs with rootdir=backend/
# (pytest only puts test-file dirs on sys.path; the app package lives at the top).
pythonpath = ["."]
# testcontainers 4.x emits a DeprecationWarning from testcontainers.postgres/redis
# pointing at testcontainers.community.*; the community modules are thin re-exports
# of the same classes, so the brief's import path stays. Hide only that warning.
filterwarnings = ["ignore:.*testcontainers\\.(postgres|redis) is deprecated.*:DeprecationWarning"]
markers = ["integration: requires a kind cluster (deselect with -m 'not integration')"]
