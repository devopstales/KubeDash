# -- Time Zone in container
TimeZone: "CET"
# -- Log level
logLevel: "INFO"
# -- flask environment: production or development
flaskConfig: "production"

# -- Enable ClusterRole creation. Disable if the role already exists.
createClusterRole: true

serviceAccount:
  # -- Enable automatic serviceAccount creation
  create: true
  # -- Configure the name of the serviceAccount
  name: "kubedash-admin"

image:
  # -- The docker image repository to use
  repository: devopstales/kubedash
  # -- The docker image pull policy
  pullPolicy: Always
  # -- The docker image tag to use
  tag: 4.1.0
  statsdExporter:
    # -- The docker image repository to use
    repository: prom/statsd-exporter
    # -- The docker image tag to use
    tag: v0.22.4

# -- pullsecrets
imagePullSecrets: []

# -- replica number - for multiple replicas you need to enable externalDatabase support
replicas: 1

# -- enable external postgresql support
externalDatabase:
  # -- Enable external postgresql
  enabled: false
  # -- External postgresql host
  host: ""
  # -- External postgresql port
  port: 5432
  # -- External postgresql database
  database: "kubedash"
  # -- External postgresql username
  username: "kubedash"
  # -- External postgresql password
  password: "kubedash"
  secret:
    # -- Name of the secret storing EXTERNAL_DATABASE_PASSWORD.
    name: "kubedash-postgresql"
    # -- Secret must provide the following variables: EXTERNAL_DATABASE_PASSWORD.
    useExistingSecret: false

metrics:
  # -- Enable metrics
  enabled: true
  serviceMonitor:
    # -- Enable prometheus service monitor
    enabled: false
    # -- Prometheus service monitor namespace
    #namespace: "monitoring"
    # -- Prometheus service monitor labels
    labels:
      release: kube-prometheus-stack
    # -- Prometheus service monitor job labels
    jobLabel: {}
    # -- Prometheus service monitor annotations
    annotations: {}
    # -- Prometheus service monitor interval
    interval: "30s"
    # -- Prometheus service monitor scrape timeout
    scrapeTimeout: "10s"
    relabelings: []
    metricRelabelings: []
    honorLabels: {}
  grafana:
    # -- Enable grafana dashboard deploy
    enabled: true 
    # -- Grafana dashboard namespace
    namespace: "monitoring-system"
    annotations:
      grafana_folder: "KubeDash"
    labels:
      grafana_dashboard: "1"

# -- deploy ui for db
dbui:
  image:
    # -- adminer image
    repository: sosedoff/pgweb
    # -- adminer image tag
    tag: latest
    # -- adminer image pull policy
    pullPolicy: IfNotPresent
    # -- adminer plugins
    plugins: "tables-filter,adminer-auto-login"

# -- deploy postgresql
postgresql:
  # -- Enable postgresql
  enabled: true
  
  rbac:
    create: true
  auth:
    # -- Postgresql database
    database: "kubedash"
    # -- Postgresql username
    username: "kubedash"
    # -- Postgresql password
    password: "kubedash"
    # -- Postgresql replication password
    replicationPassword: "change-me"
    # -- Postgresql postgres user password
    postgresPassword: "change-me"

  volumePermissions:
    # -- Enable init container to set permissions on data volume
    enabled: false
    securityContext:
      runAsUser: "auto"

  securityContext:
    # -- Enable postgresql security context
    enabled: false

  shmVolume:
    # -- Enable postgresql shared memory volume
    chmod:
      enabled: false

  primary:
    persistence:
      size: 10Gi
  readReplicas:
    # -- Number of read replicas to create
    replicaCount: 0

  metrics:
    # -- Enable postgresql metrics
    enabled: true
    serviceMonitor:
      # -- Enable prometheus service monitor
      enabled: false
      # -- Prometheus service monitor labels
      labels:
        release: kube-prometheus-stack
      # -- Set serviceMonitor labels
      jobLabel: {}
      honorLabels: {}
      # -- Prometheus service monitor namespace
      #namespace: "monitoring"
# https://artifacthub.io/packages/helm/bitnami/postgresql

# -- deploy redis-commander
redisCommander:
  # -- Enable redis-commander
  enabled: false
  image:
    repository: ghcr.io/joeferner/redis-commander
    tag: latest
    pullPolicy: IfNotPresent
  resources: {}
  # -- Redis host configuration
  redisHost: ""
  # -- Redis port
  redisPort: 6379

# -- deploy jaeger
jaeger:
  # -- Enable jaeger
  enabled: false
  image:
    repository: jaegertracing/all-in-one
    tag: latest
    pullPolicy: IfNotPresent
  resources: {}
  # -- Jaeger log level
  logLevel: info

# -- deploy kubeview
kubeview:
  # -- Enable kubeview
  enabled: false
  image:
    repository: ghcr.io/benc-uk/kubeview
    tag: latest
    pullPolicy: IfNotPresent
  resources: {}
  # -- Kubeview port
  port: 8003
  # -- Namespace filter (regex pattern)
  namespaceFilter: "^kube-"

# -- enable redis for caching
redis:
  # -- Enable redis
  enabled: true
  # -- Redis cluster architecture
  architecture: standalone
  metrics:
    # -- Enable redis metrics
    enabled: true
    serviceMonitor:
      # -- Enable prometheus service monitor
      enabled: false
      # -- Prometheus service monitor namespace
      #namespace: "monitoring"
      additionalLabels:
        release: kube-prometheus-stack

# -- enable metrics-server
metricsServer:
  enabled: false
  args:
    - --kubelet-preferred-address-types=InternalIP
    - --kubelet-insecure-tls

# -- k8s connection information.
cluster:
  # -- k8s api url
  name: "k8s-cluster"
  # -- k8s api url
  apiUrl: "https://kubernetes.mydomain.intra:6443"
  # `apiServer` is the url for kubectl
  #   This is typically  https://api.fqdn
  # -- k8s ca cert
  # IMPORTANT: If you dose not set the caCert option, the app will read from the pod
  #caCert: |-
  #  -----BEGIN CERTIFICATE-----
  #  cert data here
  #  -----END CERTIFICATE-----
  # `caCrt` is the public / CA cert for the cluster
  # cat /etc/kubernetes/pki/ca.crt

# -- oidc connection information
oidc:
  # -- Enable oidc authentication
  enabled: false
  provider:
    # -- oidc issuer url
    oidcUrl: "https://sso.mydomain.intra/auth/realms/k8s"
    # -- oidc scope
    oidcScopes: "openid email"
    # -- oidc client id
    oidcClientId: ""
    # -- oidc client secret
    oidcSecret: ""
  secret:
    # -- Name of the secret storing OIDC_CLIENT_ID and OIDC_SECRET.
    name: "kubedash-oidc"
    # -- Secret must provide the following variables: OIDC_CLIENT_ID and OIDC_SECRET.
    useExistingSecret: false

# -- enable plugins
plugins:
  registryUi:
    # -- Enable registry UI plugin
    enabled: true
  helmDashboard:
    # -- Enable helm dashboard plugin
    enabled: true
  certManager:
    # -- Enable cert-manager plugin
    enabled: true
  externalLoadbalancer:
    # -- Enable external loadbalancer plugin
    enabled: true
  flux:
    # -- Enable flux plugin
    enabled: true
  gatewayApi:
    # -- Enable gateway API plugin
    enabled: false
  trivyOperator:
    # -- Enable trivy operator plugin
    enabled: false
  iframeProxy:
    # -- Enable iframe proxy plugin
    enabled: false
  applicationCatalog:
    # -- Enable application catalog plugin
    enabled: false

# -- performance settings
performance:
  # -- Skip cluster metrics fetching for faster initial page loads
  skipClusterMetrics: false
  # -- Timeout for initial cluster metrics fetch (seconds)
  initialMetricsTimeout: 3

# -- application links configuration
applicationList: {}
  # Example configuration:
  # app_0_name: Kubeview
  # app_0_url: http://127.0.0.1:8003
  # app_0_icon: ""
  # app_0_embed: true
  # app_0_enable: true

# -- enable persistence
persistence:
  # -- Volumes for the pod
  enabled: true
  # -- Volumes mode
  accessMode: "ReadWriteOnce"
  # -- Volumes size
  size: "1Gi"
  # -- Volumes annotations
  annotations: {}
  ## database data Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
  ##   GKE, AWS & OpenStack)
  ##
  storageClass: "-"

ingress:
  # -- Enable Ingress object creation
  enabled: true
  # -- Ingress class name
  className: "nginx"
  # -- URL of the Ingress object
  url: "kubedash.mydomain.intra"
  # -- Extra annotation to the Ingress object
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/server-snippets: |
      location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
      }
  tls:
    # -- Enable tls on Ingress object
    enabled: true
    # -- Name of the secret storing tls cert
    tlsSecret: ""
    certManager:
       # -- Enable certManager
      enabled: false
      # -- Name of the certManager cluster issuer to use
      clusterIssuer: "letsencrypt"
  whitelist:
    # -- Enable ip blocking on ingress
    enabled: false
    # -- List of ips to allow communication
    ips: []
  
route:
  # -- Enable OpenShift Route object creation
  enabled: false
  # -- URL of the OpenShift Route object
  url: "kubedash.mydomain.intra"
  # -- Extra annotation to the OpenShift Route object
  annotations: {}

# -- Kubernetes API Extension (APIService) configuration
extensionApi:
  # -- Enable Kubernetes API Extension registration
  enabled: false
  # -- API group name
  group: "kubedash.devopstales.github.io"
  # -- API version
  version: "v1"
  # -- Service port for the extension API (must be 443 for API aggregation)
  servicePort: 443
  # -- Target port on the KubeDash service
  targetPort: 8000
  # -- CA bundle (base64-encoded) for TLS verification (recommended for production)
  # Leave empty to use insecureSkipTLSVerify (development only)
  caBundle: ""
  # -- Skip TLS verification (development only, still requires HTTPS endpoint)
  # WARNING: Should never be used in production
  insecureSkipTLSVerify: false
  # -- Group priority minimum for API group ordering
  groupPriorityMinimum: 1000
  # -- Version priority for API version ordering
  versionPriority: 100

# -- list of the pos's SecurityContexts
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  fsGroupChangePolicy: "OnRootMismatch"

# -- list of the container's SecurityContexts
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["all"]

## Define which Nodes the Pods are scheduled on.
## ref: https://kubernetes.io/docs/user-guide/node-selection/
# -- Set nodeSelector for the pod
nodeSelector: {}

## Tolerations for use with node taints
## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
# -- Set tolerations for the pod
tolerations: []
# - key: "key"
#   operator: "Equal"
#   value: "value"
#   effect: "NoSchedule"

## Assign custom affinity rules to the trivy operator
## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
##

## Assign custom affinity rules to the deployment
## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
# -- Set the affinity for the pod.
affinity: {}
