apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kubedash.fullname" . }}-ui
  labels:
    app: kubedash
    {{- include "kubedash.labels" . | nindent 4 }}
    checksum/config: {{ include (print $.Template.BasePath "/ui-configmap.yaml") . | sha256sum | trunc 63 }}
spec:
  serviceName: {{ include "kubedash.fullname" . }}-headless
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: kubedash
      {{- include "kubedash.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: kubedash
        {{- include "kubedash.labels" . | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/ui-configmap.yaml") . | sha256sum | trunc 63 }}
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubedash.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Graceful shutdown: time to wait for pod to terminate cleanly
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}
      initContainers:
{{- if .Values.redis.enabled }}
      - name: wait-for-redis
        image: redis:7-alpine
        command:
          - sh
          - -c
          - |
            until redis-cli -h {{ .Release.Name }}-redis -p 6379 ping; do
              echo "Waiting for Redis to be ready..."
              sleep 2
            done
            echo "Redis is ready!"
{{- end }}
{{- if or .Values.postgresql.enabled .Values.externalDatabase.enabled }}
      - name: wait-for-postgresql
        image: postgres:15-alpine
        command:
          - sh
          - -c
          - |
            {{- if .Values.postgresql.enabled }}
            until pg_isready -h {{ .Release.Name }}-postgresql -p 5432 -U {{ .Values.postgresql.auth.username }}; do
              echo "Waiting for PostgreSQL to be ready..."
              sleep 2
            done
            echo "PostgreSQL is ready!"
            {{- else if .Values.externalDatabase.enabled }}
            until pg_isready -h {{ .Values.externalDatabase.host }} -p {{ .Values.externalDatabase.port }} -U {{ .Values.externalDatabase.username }}; do
              echo "Waiting for PostgreSQL to be ready..."
              sleep 2
            done
            echo "PostgreSQL is ready!"
            {{- end }}
{{- end }}
{{- if .Values.jaeger.enabled }}
      - name: wait-for-jaeger
        image: curlimages/curl:latest
        command:
          - sh
          - -c
          - |
            until curl -f http://{{ include "kubedash.fullname" . }}-jaeger:16686/api/services; do
              echo "Waiting for Jaeger to be ready..."
              sleep 2
            done
            echo "Jaeger is ready!"
{{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
        env:
          - name: TZ
            value: {{ .Values.TimeZone }}
          - name: FLASK_CONFIG
            value: "{{ .Values.flaskConfig }}"
          # Pod identity for leader election (graceful shutdown)
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          {{- if or (eq .Values.logLevel "DEBUG") (eq .Values.logLevel "HIGH") }}
          - name: VERBOSE_LOG
            value: "True"
          {{- end }}
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: {{ .Values.service.port }}
            scheme: HTTPS
          initialDelaySeconds: 5
          timeoutSeconds: 1
          # Skip TLS verification for self-signed certificates
          # Kubernetes health probes don't verify certificates by default, but explicit is better
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: {{ .Values.service.port }}
            scheme: HTTPS
          initialDelaySeconds: 5
          timeoutSeconds: 1
          # Skip TLS verification for self-signed certificates
        # Graceful shutdown: preStop hook for graceful leadership release (10.6)
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                echo "Initiating graceful shutdown..."
                # Allow signal handlers to catch SIGTERM
                sleep 1
                # Call graceful shutdown endpoint (runs in background, returns immediately)
                curl -s -X POST https://localhost:{{ .Values.service.port }}/api/shutdown \
                  -H "Content-Type: application/json" \
                  --insecure --max-time 28 || true
                echo "Shutdown endpoint called, waiting for termination..."
                # Wait remaining time for final shutdown (total 30s - ~2 for hook exec)
                sleep 28
        ports:
        - containerPort: {{ .Values.service.port }}
          protocol: TCP
          name: http
        volumeMounts:
{{- if and .Values.persistence.enabled (not .Values.externalDatabase.enabled) (not .Values.postgresql.enabled) }}
        - name: cache
          mountPath: "/code/kubedash/database"
{{- end }}
        - mountPath: /code/kubedash/kubedash.ini
          name: kubedash-ini
          subPath: kubedash.ini
{{- if .Values.metrics.enabled }}
      - name: statsd-exporter
        image: "{{ .Values.image.statsdExporter.repository }}:{{ .Values.image.statsdExporter.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
          - containerPort: 9125
            protocol: TCP
            name: statsd-tcp
          - containerPort: 9125
            protocol: UDP
            name: statsd-udp
          - containerPort: 9102
            protocol: TCP
            name: http-monitoring
        args:
          - --statsd.mapping-config=/statsd/statsd.conf
        volumeMounts:
          - mountPath: /statsd/statsd.conf
            name: statsd-config
            subPath: statsd.conf
{{- end }}
      volumes:
{{- if and .Values.persistence.enabled (not .Values.externalDatabase.enabled) (not .Values.postgresql.enabled) }}
      - name: cache
        persistentVolumeClaim:
          claimName: {{ include "kubedash.fullname" . }}-db
{{- end }}
      - configMap:
          defaultMode: 420
          name: {{ include "kubedash.fullname" . }}-kubedash-ini
        name: kubedash-ini
{{- if .Values.metrics.enabled }}
      - configMap:
          defaultMode: 420
          name: {{ include "kubedash.fullname" . }}-statsd-config
        name: statsd-config
{{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
        {{- . | toYaml | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
        {{- . | toYaml | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
        {{- . | toYaml | nindent 8 }}
{{- end }}
{{- if .Values.dnsConfig.enabled }}
      dnsConfig:
        options:
          {{- toYaml .Values.dnsConfig.options | nindent 10 }}
{{- end }}
  volumeClaimTemplates:
{{- if and .Values.persistence.enabled (not .Values.externalDatabase.enabled) (not .Values.postgresql.enabled) }}
  - metadata:
      name: cache
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
      storageClassName: {{ .Values.persistence.storageClass | default "standard" }}
{{- end }}
