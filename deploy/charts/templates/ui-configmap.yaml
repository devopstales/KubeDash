---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubedash.fullname" . }}-kubedash-ini
  labels:
    app: kubedash
    {{ include "kubedash.labels" . | nindent 4 }}
data:
  kubedash.ini: |
    ##################### KubeDash Configuration Defaults #####################
    [DEFAULT]
    app_mode = production

    #################################### Security ############################
    [security]

    # default admin password, can be changed before first start of grafana, or in profile settings
    admin_password = admin

    #################################### Database ############################
    [database]
    {{ if .Values.externalDatabase.enabled }}
    type = postgres
    host = {{ .Values.externalDatabase.host }}
    name = {{ .Values.externalDatabase.database }}
    user = {{ .Values.externalDatabase.username }}
    password = {{ .Values.externalDatabase.password }}
    {{ else if .Values.postgresql.enabled }}
    type = postgres
    host = {{ .Release.Name }}-postgresql
    name = {{ .Values.postgresql.auth.database }}
    user = {{ .Values.postgresql.auth.username }}
    password = {{ .Values.postgresql.auth.password }}
    {{ else }}
    type = sqlite3
    {{ end }}

    #################################### Cache server #############################
    [remote_cache]
    {{ if .Values.redis.enabled }}
    redis_enabled = true
    # cache connection string options
    redis_host = {{ .Release.Name }}-redis
    redis_port = 6379
    redis_db = 0
    redis_password =
    # redis cluster
    cluster_enabled = false
    cluster_startup_nodes =
    # cache time
    short_cache_time = 60
    long_cache_time = 900
    {{ else }}
    redis_enabled = false
    redis_host = 127.0.0.1
    redis_port = 6379
    redis_db = 0
    redis_password =
    # redis cluster
    cluster_enabled = false
    cluster_startup_nodes =
    # cache time
    short_cache_time = 60
    long_cache_time = 900
    {{ end }}
    {{ if .Values.oidc.enabled }}
    #################################### SSO Settings ###########################
    [sso_settings]

    issuer_url = {{ .Values.oidc.provider.oidcUrl}}

    client_id = {{ .Values.oidc.provider.oidcClientId }}

    secret = {{ .Values.oidc.provider.oidcSecret }}

    scope = {{ .Values.oidc.provider.oidcScopes}}

    {{ if .Values.ingress.tls.enabled }}
    callback_url = https://{{ .Values.ingress.url }}
    {{ else }}
    callback_url = http://{{ .Values.ingress.url }}
    {{ end }}
    {{ end }}
    #################################### K8S ###########################
    [k8s]
    cluster_name = {{ .Values.cluster.name }}
    api_server = {{ .Values.cluster.apiUrl }}
    {{ if .Values.cluster.caCert }}
    api_ca = {{ .Values.cluster.caCert | b64enc }}
    {{ end }}

    #################################### Monitoring Settings ###########################
    [monitoring]

    jaeger_enabled = {{ .Values.jaeger.enabled }}
    {{- if .Values.jaeger.enabled }}
    jaeger_http_endpoint = http://{{ include "kubedash.fullname" . }}-jaeger:4318
    {{- else }}
    jaeger_http_endpoint = http://127.0.0.1:4318
    {{- end }}

    #################################### Plugin Settings ###########################
    [plugin_settings]
    registry = {{ .Values.plugins.registryUi.enabled }}
    helm = {{ .Values.plugins.helmDashboard.enabled }}
    gateway_api = {{ .Values.plugins.gatewayApi.enabled }}
    cert_manager = {{ .Values.plugins.certManager.enabled }}
    external_loadbalancer = {{ .Values.plugins.externalLoadbalancer.enabled }}
    flux = {{ .Values.plugins.flux.enabled }}
    trivy_operator = {{ .Values.plugins.trivyOperator.enabled }}
    iframe_proxy = {{ .Values.plugins.iframeProxy.enabled }}
    application_catalog = {{ .Values.plugins.applicationCatalog.enabled }}

    #################################### Performance Settings ###########################
    [performance]
    # Skip cluster metrics fetching for faster initial page loads
    # Useful for large clusters or when metrics server is unavailable
    skip_cluster_metrics = {{ .Values.performance.skipClusterMetrics }}
    # Timeout for initial cluster metrics fetch (seconds) - reduced for faster loading
    initial_metrics_timeout = {{ .Values.performance.initialMetricsTimeout }}

    #################################### Application links ###########################
    [application_list]
    {{- if .Values.kubeview.enabled }}
    app_0_name = Kubeview
    app_0_url = http://{{ include "kubedash.fullname" . }}-kubeview:{{ .Values.kubeview.port }}
    app_0_icon =
    app_0_embed = true
    app_0_enable = true
    {{- end }}
    {{- if and .Values.redisCommander.enabled .Values.redis.enabled }}
    app_1_name = redis-commander
    app_1_url = http://{{ include "kubedash.fullname" . }}-redis-commander:8081
    app_1_icon =
    app_1_embed = true
    app_1_enable = true
    {{- end }}
    {{- if or .Values.externalDatabase.enabled .Values.postgresql.enabled }}
    app_2_name = psql-ui
    app_2_url = http://{{ include "kubedash.fullname" . }}-db-ui:8080
    app_2_icon =
    app_2_embed = true
    app_2_enable = true
    {{- end }}
    {{- if .Values.jaeger.enabled }}
    app_3_name = Jaeger
    app_3_url = http://{{ include "kubedash.fullname" . }}-jaeger:16686
    app_3_icon =
    app_3_embed = true
    app_3_enable = true
    {{- end }}
    {{- if .Values.applicationList }}
    {{- range $key, $value := .Values.applicationList }}
    {{ $key }} = {{ $value }}
    {{- end }}
    {{- end }}
    #################################### End of Settings ###########################
{{- if .Values.metrics.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubedash.fullname" . }}-statsd-config
  labels:
    app: kubedash
    {{ include "kubedash.labels" . | nindent 4 }}
data:
  statsd.conf: |-
    # StatsD configuration
    # This file is used to configure the StatsD exporter.
    mappings:
      - match: "*.gunicorn.request.status.*"
        help: "gunicorn response code"
        name: "gunicorn_response_code"
        labels:
          app: "$1"
          status: "$2"
      - match: "*.gunicorn.workers"
        name: "gunicorn_workers"
        labels:
          app: "$1"
      - match: "*.gunicorn.requests"
        name: "gunicorn_requests"
        labels:
          app: "$1"
      - match: "*.gunicorn.request.duration"
        name: "gunicorn_request_duration"
        labels:
          app: "$1"
        timer_type: histogram  # This enables _sum/_count/_bucket generation
        buckets: [0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubedash-gunicorn-dashboard
  labels:
    grafana_dashboard: "1"
    app: kubedash
    {{ include "kubedash.labels" . | nindent 4 }}
{{- with .Values.metrics.serviceMonitor.labels  }}
{{ toYaml . | indent 4 }}
{{- end }}
data:
  gunicorn-monitoring.json: |
    {{- .Files.Get "files/gunicorn-monitoring.json" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubedash-flask-dashboard
  labels:
    grafana_dashboard: "1"
    app: kubedash
    {{ include "kubedash.labels" . | nindent 4 }}
{{- with .Values.metrics.serviceMonitor.labels  }}
{{ toYaml . | indent 4 }}
{{- end }}
data:
  flask-web-app.json: |
    {{- .Files.Get "files/flask-web-app.json" | nindent 4 }}
{{ end }}