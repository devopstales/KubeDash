apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubedash.fullname" . }}-secrets
  labels:
    {{- include "kubedash.labels" . | nindent 4 }}
type: Opaque
stringData:
  # All three are read by Settings / init_oidc (KUBEDASH_JWT_SECRET,
  # KUBEDASH_SECRET_KEY via env_prefix; OIDC_CLIENT_SECRET unprefixed)
  OIDC_CLIENT_SECRET: {{ .Values.auth.oidc.clientSecret | quote }}
  KUBEDASH_JWT_SECRET: {{ .Values.secrets.jwtSecret | default "dev-jwt-secret-32-bytes-long!!!!!01" | quote }}
  KUBEDASH_SECRET_KEY: {{ .Values.secrets.secretKey | default "dev-enc-key-32-bytes-long!!!!" | quote }}
